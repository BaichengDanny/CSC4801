{% extends 'base.html' %}{% from 'macros.html' import csrf %}
{% block title %}Private resume{% endblock %}
{% block content %}<div class="page-heading"><div><span class="eyebrow">ONLY YOU</span><h1>Your private resume</h1><p class="muted">A place to keep your experience. Never shared with employers.</p></div></div><section class="card form-card narrow"><form method="post" class="form-stack">{{ csrf() }}<div><label for="resume">Resume text</label><textarea id="resume" name="resume" rows="15" maxlength="50000">{{ details.resume }}</textarea></div><div class="form-actions"><button class="button" type="submit">Save resume</button><a href="{{ url_for('web.profile') }}">Back to profile</a></div></form></section>{% endblock %}
