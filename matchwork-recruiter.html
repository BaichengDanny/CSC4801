n>\n<\/div>\n\n<script>\n(() => {\n  'use strict';\n  const { $, $$, esc, ICON } = RW;\n  const MAX = 800;\n  const st = { mode: RW.params().get('edit') ? 'edit' : 'view', dirty: false };\n\n  RW.mountShell('company');\n  const card = $('#profile');\n\n  const website = (w) => w ? `<a href=\"https://${esc(w.replace(/^https?:\\/\\//, ''))}\" target=\"_blank\" rel=\"noopener noreferrer\">${esc(w.replace(/^https?:\\/\\//, ''))}<span class=\"sr\"> (opens in a new tab)<\/span><\/a>` : '';\n  function metaHTML(c) {\n    return [\n      c.industry && `<span class=\"meta-item\">${esc(c.industry)}<\/span>`,\n      c.size && `<span class=\"meta-item\">${ICON.users}${esc(c.size)}<\/span>`,\n      c.location && `<span class=\"meta-item\">${ICON.pin}${esc(c.location)}<\/span>`,\n      c.website && `<span class=\"meta-item\">${ICON.globe}${website(c.website)}<\/span>`,\n    ].filter(Boolean).join('');\n  }\n\n  function viewHTML(c) {\n    return `<div class=\"view\">\n      <div class=\"co\">\n        ${RW.logoHTML()}\n        <div><h1 id=\"co-name\">${esc(c.name)}<\/h1><div class=\"meta\">${metaHTML(c)}<\/div><\/div>\n        <button type=\"button\" class=\"btn btn-secondary\" id=\"editBtn\">${ICON.edit}Edit profile<\/button>\n      <\/div>\n      <div class=\"about\"><h2>About<\/h2><p>${esc(c.about)}<\/p><\/div>\n    <\/div>`;\n  }\n\n  function editHTML(c) {\n    return `<form class=\"edit\" id=\"form\" novalidate>\n      <div class=\"sec-head\"><div><h2>Edit company profile<\/h2><p>Candidates see your name and description on every job you post.<\/p><\/div><\/div>\n      <div class=\"form\">\n        <div class=\"field\"><label for=\"fName\">Company name <i aria-hidden=\"true\">*<\/i><\/label>\n          <input class=\"input\" id=\"fName\" maxlength=\"80\" value=\"${esc(c.name)}\" aria-describedby=\"eName\" required><span class=\"err\" id=\"eName\"><\/span><\/div>\n        <div class=\"field\"><label for=\"fIndustry\">Industry<\/label>\n          <input class=\"input\" id=\"fIndustry\" maxlength=\"60\" value=\"${esc(c.industry)}\" placeholder=\"e.g. Software\"><\/div>\n        <div class=\"field\"><label for=\"fSize\">Company size<\/label>\n          <select class=\"input\" id=\"fSize\"><option value=\"\">Not shown<\/option>${RW.SIZES.map((s) => `<option${s === c.size ? ' selected' : ''}>${esc(s)}<\/option>`).join('')}<\/select><\/div>\n        <div class=\"field\"><label for=\"fLoc\">Headquarters<\/label>\n          <input class=\"input\" id=\"fLoc\" maxlength=\"60\" value=\"${esc(c.location)}\" placeholder=\"City, state\"><\/div>\n        <div class=\"field full\"><label for=\"fWeb\">Website<\/label>\n          <input class=\"input\" id=\"fWeb\" maxlength=\"100\" value=\"${esc(c.website)}\" placeholder=\"yourcompany.com\" inputmode=\"url\"><\/div>\n        <div class=\"field full\"><label for=\"fAbout\">Description <i aria-hidden=\"true\">*<\/i><\/label>\n          <textarea class=\"input\" id=\"fAbout\" rows=\"6\" aria-describedby=\"eAbout aboutMeta\" required>${esc(c.about)}<\/textarea>\n          <div class=\"ta-meta\" id=\"aboutMeta\"><span>What you build and what it is like to work with you.<\/span><span id=\"count\"><\/span><\/div>\n          <span class=\"err\" id=\"eAbout\"><\/span><\/div>\n        <div class=\"form-actions\">\n          <button type=\"button\" class=\"btn btn-quiet\" id=\"cancel\">Cancel<\/button>\n          <button type=\"submit\" class=\"btn btn-primary\" title=\"Ctrl+Enter\">Save changes<\/button>\n        <\/div>\n      <\/div>\n    <\/form>`;\n  }\n\n  /* The draft as typed, so the preview can follow along before saving. */\n  function draft() {\n    if (st.mode !== 'edit') return RW.company();\n    return { ...RW.company(), name: $('#fName').value.trim(), industry: $('#fIndustry').value.trim(), size: $('#fSize').value, location: $('#fLoc').value.trim(), website: $('#fWeb').value.trim(), about: $('#fAbout').value.trim() };\n  }\n  function renderPreview() {\n    const c = draft();\n    const mono = (c.name.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();\n    $('#preview').innerHTML = `<div class=\"pv-head\"><span class=\"logo-tile sm mono\" style=\"color:${esc(c.tint)};background:${esc(c.tileBg)}\" aria-hidden=\"true\">${esc(mono)}<\/span>\n        <div style=\"min-width:0\"><b>${c.name ? esc(c.name) : '<span class=\"empty-val\">Company name<\/span>'}<\/b><div class=\"meta\">${[c.industry, c.size].filter(Boolean).map(esc).join(' · ') || '<span class=\"empty-val\">Industry · size<\/span>'}<\/div><\/div><\/div>\n      <h3>About ${c.name ? esc(c.name) : 'the company'}<\/h3>\n      <p>${c.about ? esc(c.about) : '<span class=\"empty-val\">Your description shows here.<\/span>'}<\/p>`;\n    $('#live').hidden = st.mode !== 'edit';\n  }\n  function renderCount() {\n    const n = $('#fAbout').value.trim().length, el = $('#count');\n    el.textContent = `${n} / ${MAX}`;\n    el.classList.toggle('over', n > MAX);\n  }\n\n  function render(animate) {\n    const c = RW.company();\n    card.innerHTML = st.mode === 'edit' ? editHTML(c) : viewHTML(c);\n    if (animate && !RW.reduceMotion) card.firstElementChild.classList.add('enter');\n    if (st.mode === 'edit') wireForm(); else $('#editBtn').addEventListener('click', () => { st.mode = 'edit'; render(true); syncURL(); });\n    renderPreview();\n  }\n  function syncURL() { const u = RW.url(); st.mode === 'edit' ? u.searchParams.set('edit', '1') : u.searchParams.delete('edit'); history.replaceState(null, '', u); }\n\n  function wireForm() {\n    const form = $('#form');\n    renderCount();\n    form.addEventListener('input', (e) => { st.dirty = true; renderPreview(); if (e.target.id === 'fAbout') renderCount(); const i = e.target; if (i.getAttribute('aria-invalid')) { i.removeAttribute('aria-invalid'); const er = $('#e' + i.id.slice(1)); if (er) er.textContent = ''; } });\n    form.addEventListener('change', () => { st.dirty = true; renderPreview(); });\n    $('#cancel').addEventListener('click', () => {\n      if (st.dirty && !window.confirm('Discard your changes to the company profile?')) return;\n      st.dirty = false; st.mode = 'view'; render(true); syncURL(); $('#editBtn').focus();\n    });\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      const d = draft();\n      if (d.about.length > MAX) { showErrors({ about: `Keep the description under ${MAX} characters.` }); return; }\n      const res = RW.updateCompany({ name: d.name, industry: d.industry, size: d.size, location: d.location, website: d.website.replace(/^https?:\\/\\//, ''), about: d.about });\n      if (!res.ok) { showErrors(res.errors || {}); if (!res.errors) RW.toast(res.message, { error: true }); return; }\n      st.dirty = false; st.mode = 'view'; render(true); syncURL(); renderRoles();\n      RW.toast('Company profile saved');\n      $('#editBtn').focus();\n    });\n    $('#fName').focus({ preventScroll: true });\n    /* Ctrl/Cmd+Enter saves, Escape cancels (popovers handle their own Escape first). */\n    form.addEventListener('keydown', (e) => {\n      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }\n      else if (e.key === 'Escape' && !document.querySelector('.popover.open')) { e.preventDefault(); $('#cancel').click(); }\n    });\n  }\n  function showErrors(errors) {\n    const map = { name: ['#fName', '#eName'], about: ['#fAbout', '#eAbout'] };\n    let first = null;\n    Object.entries(errors).forEach(([k, msg]) => { const f = map[k]; if (!f) return; $(f[0]).setAttribute('aria-invalid', 'true'); $(f[1]).textContent = msg; first = first || $(f[0]); });\n    if (first) { first.focus(); first.classList.remove('shake'); void first.offsetWidth; first.classList.add('shake'); }\n  }\n  window.addEventListener('beforeunload', (e) => { if (st.dirty) { e.preventDefault(); e.returnValue = ''; } });\n\n  function renderRoles() {\n    const open = RW.jobs().filter((j) => j.status === 'Active');\n    $('#roles').innerHTML = open.length\n      ? open.map((j) => `<a class=\"role\" href=\"jobs?id=${encodeURIComponent(j.id)}\">${RW.logoHTML('sm')}<span style=\"min-width:0\"><h3>${esc(j.title)}<\/h3><span class=\"meta\"><span class=\"type\">${esc(j.type)}<\/span><span aria-hidden=\"true\">·<\/span><span>${esc(j.location)}<\/span><\/span><\/span><span class=\"n\">${j.apps} applicant${j.apps === 1 ? '' : 's'}<\/span><svg class=\"c\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/><\/svg><\/a>`).join('')\n      : '<p class=\"ad-text\">No open roles. <a href=\"jobs?new=1\" style=\"color:var(--green-700);font-weight:600\">Post a job<\/a><\/p>';\n  }\n\n  render(false);\n  renderRoles();\n})();\n<\/script>\n<span id=\"mw-ready\" hidden><\/span>\n<\/body>\n<\/html>\n"};
