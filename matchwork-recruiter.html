:1;\n}\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}\nbutton,input,textarea,select{font:inherit;color:inherit}\na{color:inherit}\nsvg{display:block}\nh1,h2,h3,p{margin:0}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n:focus-visible{outline:2px solid var(--green-600);outline-offset:2px}\n.num{font-variant-numeric:tabular-nums}\n\n/* ---------- App shell ---------- */\n.app{position:relative;display:flex;height:100vh;height:100dvh;overflow:hidden}\n.deco-br{position:absolute;right:0;bottom:0;pointer-events:none}\n\n.sidebar{position:relative;flex:0 0 228px;background:var(--sidebar);border-right:2px solid #F3F3F3;display:flex;flex-direction:column;overflow:hidden;z-index:1}\n.brand{display:flex;align-items:center;gap:12px;margin:25px 0 0 34px;height:24px;text-decoration:none;color:var(--ink);width:max-content}\n.brand span{font-size:18px;font-weight:700;letter-spacing:-.2px}\n.brand svg{transition:transform .4s var(--ease-spring)}\n.brand:hover svg{transform:rotate(-8deg) scale(1.08)}\n.portal-label{margin:44px 0 0 34px;font-size:14px;line-height:18px;color:#62676C}\n.nav{position:relative;display:flex;flex-direction:column;gap:2px;margin:14px 18px 0 17px}\n.nav-indicator{position:absolute;left:0;right:0;top:0;height:46px;background:var(--green-75);pointer-events:none}\n.nav-item{position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px 0 17px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;transition:background-color .2s,color .2s}\n.nav-item:hover{background:rgba(47,107,74,.05)}\n.nav-item[aria-current=\"page\"]{font-weight:600;color:var(--green-900)}\n.nav-item[aria-current=\"page\"]:hover{background:transparent}\n.nav-item svg{flex:none}\n.nav-item .label{flex:1;white-space:nowrap;o age/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23E6EAE7'/%3E%3Cpath d='M9 9l6 6M15 9l-6 6' stroke='%235F6368' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E\") center/18px no-repeat;cursor:pointer}\n.search-sep{flex:none;width:1px;height:24px;margin:0 4px;background:#E3E6E4;transition:opacity .18s ease}\n.search:has(.search-field:focus-within) .search-sep,.search:has(.search-field:hover) .search-sep{opacity:0}\n.search-btn{flex:none;height:36px;padding:0 18px;margin-left:6px;border:0;background:var(--green-700);color:#fff;font-size:14px;font-weight:700;letter-spacing:.1px;cursor:pointer;transition:background-color .18s ease}\n.search-btn:hover{background:var(--green-900)}\n.search-btn:active{background:#173B28}\n.icon-btn{position:relative;width:40px;height:40px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .2s}\n.icon-btn:hover{background:#F0F1F1}\n.icon-btn:hover .bell{animation:ring .6s var(--ease)}\n@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}\n.bell{transform-origin:50% 4px}\n.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:#7DB98F;border:2px solid var(--bg);transition:transform .25s var(--ease)}\n.dot.hide{transform:scale(0)}\n.bell-wrap{position:relative;margin-right:14px}\n.account{position:relative}\n.account-btn{display:flex;align-items:center;gap:13px;border:0;background:transparent;cursor:pointer;padding:0;border-radius:24px}\n.avatar{width:44px;height:44px;border-radius:50%;background:#E3E2E7;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none;transition:box-shadow .2s}\n.account-btn:hover .avatar{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--chip-active)}\n.account-btn .chev{transition:transform .25s var(--ease)}\n.account-btn[aria-expanded=\"true\"] .chev{transform:rotate(180deg)}\n\n/* Popovers */\n.popover{position:absolute;top:calc(100% + 10px);right:0;min-width:220px;background:var(--surface);border:1px solid var(--line-3);box-shadow:var(--shadow-md);padding:6px;z-index:20;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;visibility:hidden;transition:opacity .18s,transform .22s var(--ease),visibility 0s .22s}\n.popover.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .18s,transform .22s var(--ease)}\n.popover.left{right:auto;left:0;transform-origin:top left}\n.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;font-size:14px;font-weight:500;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink);transition:background-color .15s}\n.menu-item:hover{background:#F3F6F4}\n.menu-item.danger{color:var(--danger)}\n.menu-item.danger:hover{background:var(--danger-wash)}\n.menu-sep{height:1px;background:var(--line-3);margin:6px 4px}\n.notif{width:300px}\n.notif-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:14px;font-weight:700}\n.notif-head button{border:0;background:none;color:var(--green-700);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}\n.notif-head button:hover{background:var(--green-75)}\n.notif-head button:disabled{color:var(--muted);background:none;cursor:default}\n.notif-item{display:flex;gap:10px;padding:10px;font-size:13px;line-height:18px;color:var(--ink-2);text-decoration:none}\na.notif-item:hover{background:#F3F6F4}\n.notif-item strong{color:var(--ink)}\n.notif-item time{display:block;color:var(--muted);font-size:12px;margin-top:2px}\n.notif-icon{flex:none;width:32px;height:32px;border-radius:50%;background:var(--lavender-wash);display:flex;align-items:center;justify-content:center}\n\n/* ---------- Page body ---------- */\n.body{flex:1 1 auto;min-height:0;display:flex;gap:20px;align-items:stretch;margin-top:12px}\n.col-left{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px}\n.col-right{flex:0 0 var(--rail);min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px}\n.card{background:var(--surface);border:1px solid var(--line)}\n.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#DADFDB transparent;overscroll-behavior:contain}\n.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}\n.page-head h1{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.3px}\n.page-head p{margin-top:3px;font-size:15px;line-height:20px;color:#555A60;max-width:520px}\n.rail-card{padding:18px;display:flex;flex-direction:column;gap:14px}\n.rail-card h2{font-size:18px;line-height:24px;font-weight:700}\n.panel{background:var(--green-50);border:1px solid #EEF0F0;padding:14px}\n.section-title{font-size:16px;line-height:20px;font-weight:700}\n\n/* ---------- Buttons ---------- */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid transparent;font-size:14px;font-weight:600;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s,transform .2s var(--ease),box-shadow .2s}\n.btn:active{transform:scale(.97)}\n.btn-primary{background:var(--green-700);color:#fff}\n.btn-primary:hover{background:var(--green-900)}\n.btn-primary:disabled,.btn-primary[aria-disabled=\"true\"]{background:#C9D3CD;color:#fff;cursor:not-allowed;transform:none}\n.btn-secondary{background:var(--surface);border-color:var(--line-2);color:var(--ink);height:34px;padding:0 12px}\n.btn-secondary:hover{border-color:#B8CBBE;background:var(--green-50)}\n.btn-text{background:transparent;color:var(--green-600);height:32px;padding:0 9px}\n.btn-text:hover{background:var(--green-75);color:var(--green-900)}\n.btn-quiet{background:transparent;color:var(--muted);height:32px;padding:0 9px}\n.btn-quiet:hover{background:#F2F4F3;color:var(--ink)}\n.btn-danger-quiet{background:transparent;color:var(--muted);height:32px;padding:0 9px}\n.btn-danger-quiet:hover{background:var(--danger-wash);color:var(--danger)}\n.btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n.link-arrow{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 9px;font-size:14px;font-weight:600;color:var(--green-600);text-decoration:none;border:0;background:none;cursor:pointer;transition:color .2s,background-color .2s}\n.link-arrow svg{transition:transform .25s var(--ease)}\n.link-arrow:hover{color:var(--green-900);background:var(--green-75)}\n.link-arrow:hover svg{transform:translateX(3px)}\n\n/* Save + Apply (job actions, identical to the dashboard) */\n.save-btn{flex:none;width:38px;height:36px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background-color .2s,transform .15s}\n.save-btn:hover{border-color:#B8CBBE;background:var(--green-50)}\n.save-btn:active{transform:scale(.92)}\n.save-btn svg path{fill:transparent;stroke:#202124;transition:fill .2s,stroke .2s}\n.save-btn:hover svg path{stroke:var(--green-700)}\n.save-btn[aria-pressed=\"true\"]{border-color:#CCDCD1;background:var(--green-75)}\n.save-btn[aria-pressed=\"true\"] svg path{fill:var(--green-600);stroke:var(--green-600)}\n.save-btn.pop svg{animation:pop .45s var(--ease-spring)}\n@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}\n.apply-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:100px;height:36px;padding:0 12px 0 14px;border:0;background:var(--green-700);color:#fff;font-size:14px;line-height:1;font-weight:600;letter-spacing:.2px;white-space:nowrap;cursor:pointer;overflow:hidden;transition:background-color .2s,transform .2s var(--ease),box-shadow .2s}\n.apply-btn .arrow{transition:transform .25s var(--ease)}\n.apply-btn:hover{background:var(--green-900);transform:translateY(-1px);box-shadow:0 6px 14px rgba(31,77,52,.22)}\n.apply-btn:hover .arrow{transform:translateX(3px)}\n.apply-btn:active{transform:translateY(0) scale(.97);box-shadow:none}\n.apply-btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}\n.apply-btn.loading{pointer-events:none}\n.apply-btn.applied{background:var(--green-100);color:var(--green-900);cursor:default;padding:0 12px}\n.apply-btn.applied:hover{transform:none;box-shadow:none;background:var(--green-100)}\n.apply-btn.applied .check{animation:pop .45s var(--ease-spring)}\n.apply-btn.lg{height:40px;min-width:120px;font-size:15px}\n\n/* ---------- Chips + segmented ---------- */\n.chips{position:relative;display:flex;flex-wrap:nowrap;gap:8px;min-width:0}\n.chip-indicator{position:absolute;left:0;top:0;height:32px;background:var(--chip-active);box-shadow:inset 0 0 0 1px #CFDFD4;pointer-events:none;transition:none}\n.ready .chip-indicator{transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}\n.ready .nav-indicator{transition:transform .15s cubic-bezier(.22,1,.36,1)}\n.chip{position:relative;flex:none;height:32px;padding:0 14px;border:1px solid var(--line-2);background:transparent;color:#2A2F33;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .18s ease,color .18s ease,background-color .18s ease}\n.chip:hover{border-color:#D8DEDA;background:#F6F7F7;color:var(--ink)}\n.chip[aria-pressed=\"true\"],.chip[aria-selected=\"true\"]{border-color:transparent;background:transparent;color:var(--green-900);-webkit-text-stroke:.3px currentColor;cursor:default}\n.chip .count{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;-webkit-text-stroke:0}\n.chip[aria-pressed=\"true\"] .count,.chip[aria-selected=\"true\"] .count{color:var(--green-800)}\n.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:#F2F4F3}\n.seg button{height:28px;padding:0 10px;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s,box-shadow .15s}\n.seg button:hover{color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{background:#fff;color:var(--green-900);font-weight:600;box-shadow:0 1px 2px rgba(23,25,28,.08)}\n.filter-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 12px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(23,25,28,.04);transition:border-color .18s ease,background-color .18s ease}\n.filter-btn:hover{border-color:#C9D2CC;background:#FAFBFA}\n.filter-btn[aria-expanded=\"true\"]{border-color:#C9D3CC;background:#F6F7F7}\n.filter-count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#EEF0EF;color:var(--ink-2);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}\n.filter-count.active{background:var(--green-100);color:var(--green-900)}\n.fp-label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}\n.fp-check{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;cursor:pointer}\n.fp-check input{width:16px;height:16px;margin:0;accent-color:var(--green-700);cursor:pointer}\n\n/* ---------- Job atoms ---------- */\n.logo-tile{flex:none;width:56px;height:56px;border:1px solid #E6E8EA;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease),box-shadow .3s}\n.logo-tile.sm{width:44px;height:44px}\n.logo-tile.sm img{transform:scale(.82)}\n.logo-tile.xs{width:36px;height:36px}\n.logo-tile.xs img{transform:scale(.64)}\n.mono{font-size:22px;font-weight:800;letter-spacing:-.5px}\n.logo-tile.sm.mono{font-size:18px}\n.logo-tile.xs.mono{font-size:15px}\n.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:13px;line-height:18px;color:var(--muted-2)}\n.meta svg{flex:none}\n.meta .type{color:var(--ink-2)}\n.tags{display:flex;flex-wrap:wrap;gap:8px}\n.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;line-height:21px;font-weight:500;color:var(--muted-2);background:#F4F4F6;border-radius:6px;padding:0 8px;white-space:nowrap}\n.tag.match{color:var(--green-900);background:#F1F4F2;font-weight:600;padding-left:6px}\n.score{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 13px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}\n.score.hi{background:var(--match-wash);color:var(--match-green);padding-left:11px}\n.score.mid{background:#F3F6F4;color:var(--match-green)}\n.score.lo{background:var(--honey-wash);color:var(--honey-ink)}\n\n/* Application status pills (status washes only) */\n.status{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 10px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap}\n.status::before{content:\"\";width:7px;height:7px;border-radius:50%;background:currentColor}\n.status.pending{background:#F2F3F4;color:#4F555B}\n.status.interviewing{background:var(--lavender-wash);color:var(--lavender-ink)}\n.status.accepted{background:var(--green-100);color:var(--green-900)}\n.status.rejected{background:var(--blush-wash);color:var(--blush-ink)}\n\n/* Skill-overlap meter: one segment per required skill */\n.overlap{display:flex;gap:3px;height:8px}\n.overlap i{flex:1 1 0;border-radius:3px;background:#E8ECE9}\n.overlap i.on{background:var(--green-500)}\n.overlap.none i{background:#E8ECE9}\n\n/* ---------- Job detail (Find Jobs, Saved Jobs) ---------- */\n.jd{display:flex;flex-direction:column;gap:18px;padding:22px 24px 26px}\n.jd-head{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:16px;align-items:start}\n.jd-title h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.3px}\n.jd-title .meta{margin-top:4px}\n.jd-title .co{color:var(--ink);font-weight:600}\n.jd-posted{color:var(--muted)}\n.jd-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}\n.jd-actions .save-btn{width:42px;height:40px}\n.jd-actions .link-arrow{margin-left:2px;gap:9px;color:var(--ink-2)}\n.jd-actions .link-arrow:hover{color:var(--green-900)}\n.jd-match{display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px}\n.jd-match-top{display:flex;align-items:center;gap:16px}\n.jd-match-top > div{display:flex;align-items:baseline;gap:5px;flex:none}\n.jd-pct{font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.8px;color:var(--green-900)}\n.jd-pct-label{font-size:13px;font-weight:600;color:var(--green-800)}\n.jd-match-top p{font-size:14px;line-height:20px;color:var(--ink-2);padding-left:16px;border-left:1px solid #E5E8E6}\n.jd-match-top b{color:var(--ink)}\n.jd-match .overlap{height:8px}\n.jd-hint{font-size:13px;line-height:18px;color:var(--muted)}\n.jd-hint b{color:var(--ink-2);font-weight:600}\n.jd-hint a{color:var(--green-700);font-weight:600;text-underline-offset:3px}\n.jd-hint a:hover{color:var(--green-900)}\n.jd-section{border-top:1px solid var(--row-line);padding-top:18px}\n.jd-section h3{font-size:16px;line-height:20px;font-weight:700;margin-bottom:8px}\n.jd-section p,.jd-body li{font-size:14px;line-height:22px;color:var(--ink-2);max-width:64ch}\n.jd-lede{color:var(--ink)!important;font-weight:500}\n.jd-body p{margin-top:8px}\n.jd-body ul{margin:8px 0 0;padding-left:20px}\n.jd-body li::marker{color:var(--sage,#7FAE8E)}\n.jd-body li + li{margin-top:4px}\n.jd-co-meta{margin-top:8px}\n.jd-source .link-arrow{margin:8px 0 0 -9px}\n.jd-source p{color:var(--muted)}\n.jd.enter{animation:jdIn .35s var(--ease) both}\n@keyframes jdIn{from{opacity:0;transform:translateY(6px)}}\n\n/* Empty state */\n.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:20px}\n.empty svg{margin:0 auto 14px}\n.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}\n.empty .btn{margin-top:14px}\n\n/* Toast */\n.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;pointer-events:none}\n.toast{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--moss-ink);color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(12px) scale(.98);transition:opacity .2s,transform .3s var(--ease);white-space:nowrap}\n.toast.show{opacity:1;transform:none;pointer-events:auto}\n.toast.error{background:#3A1F1D}\n.toast button{border:0;background:rgba(255,255,255,.12);color:#CDE8D5;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer;transition:background-color .2s}\n.toast button:hover{background:rgba(255,255,255,.2)}\n\n/* ---------- Corner system (squircle where supported) ---------- */\n.nav-indicator,.nav-item,.icon-btn,.menu-item,.notif-item,.search-field,.search-btn,.filter-btn,.save-btn,.apply-btn,\n.btn,.link-arrow,.notif-head button,.seg button,.logo-tile,.r-sm{border-radius:calc(var(--r-sm) * var(--sq))}\n.panel,.seg,.toast button,.r-md{border-radius:calc(var(--r-md) * var(--sq))}\n.search,.chip,.chip-indicator,.toast,.r-lg{border-radius:calc(var(--r-lg) * var(--sq))}\n.popover,.card{border-radius:calc(var(--r-xl) * var(--sq))}\n.seg button{border-radius:calc((var(--r-md) - 3px) * var(--sq))}\n.logo-tile.xs{border-radius:calc(10px * var(--sq))}\n@supports (corner-shape: squircle){\n  :root{--sq:1.6}\n  .nav-indicator,.nav-item,.icon-btn,.menu-item,.notif-item,.search,.search-field,.search-btn,.filter-btn,.save-btn,.apply-btn,\n  .btn,.link-arrow,.notif-head button,.seg,.seg button,.logo-tile,.panel,.toast,.toast button,.chip,.chip-indicator,\n  .popover,.card,.r-sm,.r-md,.r-lg{corner-shape:squircle}\n}\n\n\n/* ---------- Tab switching ----------\n   Pages are separate documents. Cross-document view transitions keep the sidebar and\n   top bar still and only cross-fade the content; browsers without support just navigate. */\nhtml{background:var(--bg)}\n.app{zoom:var(--mw-zoom,1);height:calc(100vh / var(--mw-zoom,1));height:calc(100dvh / var(--mw-zoom,1))}\n.topbar{position:relative;z-index:5}\n@media (prefers-reduced-motion:no-preference){\n  @view-transition{navigation:auto}\n  .sidebar{view-transition-name:mw-sidebar}\n  .topbar{view-transition-name:mw-topbar}\n  .main{view-transition-name:mw-main}\n  ::view-transition-old(root),::view-transition-new(root){animation:none}\n  ::view-transition-group(mw-sidebar),::view-transition-group(mw-topbar),::view-transition-group(mw-main){animation:none}\n  ::view-transition-old(mw-sidebar),::view-transition-old(mw-topbar){display:none}\n  ::view-transition-new(mw-sidebar),::view-transition-new(mw-topbar){animation:none}\n  /* Crossfade with no dip: the new page fades in faster than the old one fades out, and the\n     pair blends with plus-lighter, so the background never shows through mid-switch. */\n  ::view-transition-old(mw-main){animation:mw-out .2s cubic-bezier(.4,0,.6,1) both}\n  ::view-transition-new(mw-main){animation:mw-in .2s cubic-bezier(.2,.8,.2,1) both}\n}\n@keyframes mw-out{to{opacity:0}}\n@keyframes mw-in{from{opacity:0;transform:translateY(4px)}}\nhtml.mw-loading,html.mw-loading *{cursor:progress}\n\n/* ---------- Responsive shell ---------- */\n@media (max-width:1400px){\n  .sidebar{flex-basis:204px}\n  .brand,.portal-label{margin-left:28px}\n  .nav,.logout{margin-left:12px;margin-right:12px}\n  .nav-item{padding-left:14px;gap:12px}\n  .divider{margin-left:28px;margin-right:24px}\n  .deco-bl{width:204px}\n  .main{padding-left:22px}\n}\n@media (max-width:1180px), (max-height:620px){\n  .app{height:auto;min-height:100vh}\n  .scroll{overflow:visible}\n}\n@media (max-width:1180px){\n  .topbar-right{flex:0 0 auto}\n  .body{flex-wrap:wrap}\n  .col-right{flex:1 1 100%}\n}\n@media (max-width:860px){\n  .app{flex-direction:column}\n  .sidebar{flex:none;border-right:0;border-bottom:1px solid #EFEFEF;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}\n  .brand{margin:0 8px 0 4px}\n  .portal-label,.divider,.sidebar-spacer,.deco-bl,.nav-indicator,.deco-br{display:none}\n  .nav{flex-direction:row;margin:0}\n  .nav-item{height:40px;padding:0 12px;white-space:nowrap}\n  .nav-item[aria-current=\"page\"]{background:var(--green-75)}\n  .logout{margin:0}\n  .main{padding:12px}\n  .bell-wrap{margin-right:4px}\n}\n@media (max-width:700px){\n  .search-field.loc,.search-sep{display:none}\n  .topbar{gap:10px}\n}\n@media (max-width:520px){\n  .account-btn .chev{display:none}\n  .search-btn{padding:0 12px;margin-left:4px}\n  .search-field{gap:8px;padding-left:8px}\n  .topbar-right{gap:4px}\n}\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}\n}\n\n<\/style>\n<style>\n/* Matchwork employer pages: list + detail layouts, forms and atoms shared by My Jobs, Applicants,\n   Interviews and Company Profile. Built on ../candidate/assets/shell.css (DESIGN.md, \"The Greenhouse\"). */\n\n/* ---------- Browser surfaces ---------- */\n::selection{background:#D6E7DB;color:var(--ink)}\n.scroll::-webkit-scrollbar{width:8px}\n.scroll::-webkit-scrollbar-thumb{background:#DADFDB;border-radius:4px}\n.scroll::-webkit-scrollbar-track{background:transparent}\n\n/* ---------- Top bar: one search field with a shortcut hint ---------- */\n\n/* ---------- People ---------- */\n.person-av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink-2)}\n.person-av.lg{width:56px;height:56px;font-size:19px}\n\n/* ---------- List page: one card with head, filters, table header and a scrolling list ---------- */\n.list-page{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:16px 0 0}\n.list-page .page-head{padding:0 22px 0 23px;align-items:flex-start}\n.page-head .btn{margin-top:2px}\n.toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:14px 22px 0 23px}\n.toolbar .chips{flex:1 1 auto;overflow-x:auto;scrollbar-width:none;padding:1px}\n.thead{flex:none;display:grid;column-gap:16px;align-items:center;margin:14px 14px 0;padding:0 10px 8px;border-bottom:1px solid var(--row-line);font-size:12px;font-weight:600;color:var(--muted)}\n.list{flex:1 1 auto;min-height:0;padding:4px 14px 12px}\n.lrow{position:relative;display:grid;column-gap:16px;align-items:center;width:100%;padding:12px 10px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font-size:13px;border-radius:calc(var(--r-md) * var(--sq));transition:background-color .2s}\n.lrow + .lrow::after{content:\"\";position:absolute;left:10px;right:10px;top:0;height:1px;background:var(--row-line)}\n.lrow:hover{background:#FAFBFA}\n.lrow[aria-current=\"true\"]{background:#F3F7F4}\n.lrow[aria-current=\"true\"]::after,.lrow[aria-current=\"true\"] + .lrow::after,.lrow:hover::after,.lrow:hover + .lrow::after{opacity:0}\n.lrow h3{font-size:15px;line-height:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.lrow[aria-current=\"true\"] h3{color:var(--green-900)}\n.lrow .meta{margin-top:1px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}\n.lrow .sub{display:block;font-size:13px;line-height:18px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.lrow:active{background:#EEF3EF}\n/* Rows sit in a scrolling list, so the focus ring goes inside the row instead of being clipped. */\n.lrow:focus-visible{outline-offset:-2px}\n/* Tags that don't fit fade out at the cell edge instead of being cut mid-word. */\n.lrow .tags{flex-wrap:nowrap;overflow:hidden;gap:6px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}\n.lrow .score,.lrow .status{justify-self:start}\n.lrow .chev{color:#9AA19C;transition:color .2s,transform .25s var(--ease)}\n.lrow:hover .chev{color:var(--green-700);transform:translateX(2px)}\n.lrow .count{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}\n.lrow .count small{display:block;font-size:12px;font-weight:500;color:var(--muted)}\n.lrow.enter{animation:rowIn .4s var(--ease) both}\n.lrow.flash{animation:flash 1.2s var(--ease)}\n@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}\n@keyframes flash{0%,40%{background:var(--green-75)}}\n\n.ivcell{display:flex;align-items:center;gap:7px;color:var(--ink-2);min-width:0}\n.ivcell svg{flex:none;color:var(--muted)}\n.ivcell span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}\n.ivcell.none,.ivcell.past{color:#8A918C}\n.ivcell.todo{color:var(--honey-ink);font-weight:600}\n.ivcell.todo svg{color:var(--honey-ink)}\n\n/* ---------- Rail detail ---------- */\n.rail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}\n.ad{flex:1 1 auto;min-height:0;padding:18px;display:flex;flex-direction:column;gap:16px}\n.ad.enter{animation:rowIn .32s var(--ease) both}\n.ad-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center}\n.ad-head h2{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.2px}\n.ad-head .meta{margin-top:1px}\n.ad-facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}\n.ad-sub{font-size:14px;line-height:18px;font-weight:700;margin-bottom:10px}\n.ad-text{font-size:14px;line-height:21px;color:var(--ink-2)}\n.ad-text b{color:var(--ink);font-weight:600}\n.ad-body p,.ad-body li{font-size:14px;line-height:21px;c "round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/span>\n              <span>Post a New Job<\/span>\n              <svg class=\"row-chev\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/><\/svg>\n            <\/a>\n            <a href=\"interviews#availability\" class=\"qa\">\n              <span class=\"qa-ico\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#202124\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"16\" rx=\"2\"/><path d=\"M4 10h16M8 3v4M16 3v4M12 13.5v5M9.5 16h5\"/><\/svg><\/span>\n              <span>Create Interview Slot<\/span>\n              <svg class=\"row-chev\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/><\/svg>\n            <\/a>\n            <a href=\"company?edit=1\" class=\"qa\">\n              <span class=\"qa-ico\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#202124\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z\"/><path d=\"m13.5 6.5 4 4\"/><\/svg><\/span>\n              <span>Edit Company Profile<\/span>\n              <svg class=\"row-chev\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/><\/svg>\n            <\/a>\n          <\/div>\n          <div class=\"qa-sep\" aria-hidden=\"true\"><\/div>\n          <div class=\"rail-head\"><h2 class=\"section-title\" id=\"pipe-title\">Hiring Pipeline<\/h2><\/div>\n          <div class=\"pipe\" id=\"pipeline\" aria-labelledby=\"pipe-title\"><\/div>\n        <\/section>\n      <\/div>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n/* Employer dashboard: everything on it comes from the shared store in recruiter.js. */\n(function () {\n  'use strict';\n  const { $, $$, esc, ICON, reduceMotion } = RW;\n\n  RW.mountShell('dashboard', { onLayout: () => fitRows() });\n\n  const CHEV = '<svg class=\"row-chev\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/><\/svg>';\n  const enter = (i) => (reduceMotion ? '' : ` enter\" style=\"animation-delay:${i * 50}ms`);\n  const WEEK = 7 * 864e5;\n\n  /* ---------- Welcome + stats ---------- */\n  function renderWelcome(animate) {\n    const c = RW.company(), jobs = RW.jobs(), apps = RW.allApplicants();\n    $('#welcome-title').textContent = c.name;\n    const h = Number(RW.fmt(RW.NOW, { hour: 'numeric', hourCycle: 'h23' }));\n    $('#greeting').textContent = h < 12 ? 'Good morning,' : h < 18 ? 'Good afternoon,' : 'Good evening,';\n    const fresh = jobs.filter((j) => RW.NOW - new Date(j.posted) < WEEK && new Date(j.posted) <= RW.NOW).length;\n    const delta = $('#stDelta');\n    delta.hidden = !fresh; delta.textContent = `+${fresh} this week`;\n    const counts = { stJobs: jobs.length, stApps: apps.length, stIv: apps.filter((a) => a.status === 'Interviewing').length, stAcc: apps.filter((a) => a.status === 'Accepted').length };\n    Object.entries(counts).forEach(([id, n]) => countTo($('#' + id), n, animate));\n  }\n  function countTo(el, end, animate) {\n    const from = Number(el.textContent) || 0;\n    if (!animate || reduceMotion || from === end) { el.textContent = end; return; }\n    const t0 = performance.now(), dur = 700;\n    const tick = (t) => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(from + (end - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };\n    requestAnimationFrame(tick);\n  }\n\n  /* ---------- Recent applicants: the last two weeks, best match first ---------- */\n  function renderApplicants(animate) {\n    const recent = RW.allApplicants().filter((a) => RW.NOW - new Date(a.appliedAt) < 2 * WEEK).slice(0, 6);\n    $('#applicants').innerHTML = recent.length ? recent.map((a, i) => {\n      const shown = RW.candTagsHTML(a.cand, a.job, 2);\n      return `<a href=\"applicants?job=${encodeURIComponent(a.jobId)}#${esc(a.id)}\" class=\"row app-row${animate ? enter(i) : ''}\" aria-label=\"${esc(a.name)}, ${esc(a.job.title)}, ${a.match}% match, ${esc(a.status)}\">\n        ${RW.avatarHTML(a.cand)}\n        <span class=\"who\"><b>${esc(a.name)}<\/b><span>${esc(a.job.title)}<\/span><\/span>\n        <span class=\"tags\">${shown}<\/span>\n        ${RW.scoreHTML(a.match)}\n        ${RW.statusHTML(a.status)}\n        ${CHEV}\n      <\/a>`;\n    }).join('') : '<div class=\"empty\">No new applicants in the last two weeks.<\/div>';\n  }\n\n  /* ---------- Job postings: active jobs, newest first ---------- */\n  function renderPostings(animate) {\n    const list = RW.jobs().filter((j) => j.status === 'Active');\n    $('#postings').innerHTML = list.length ? list.map((j, i) => `<div class=\"row job-row${animate ? enter(i + 2) : ''}\">\n      ${RW.logoHTML('sm')}\n      <div style=\"min-width:0\">\n        <h3><a href=\"jobs?id=${encodeURIComponent(j.id)}\">${esc(j.title)}<\/a><\/h3>\n        <div class=\"meta\"><span class=\"type\">${esc(j.type)}<\/span><span aria-hidden=\"true\">·<\/span><span>${esc(j.location)}<\/span><\/div>\n      <\/div>\n      <div class=\"count\"><b>${j.apps}<\/b><span>Applications<\/span><\/div>\n      <div class=\"count\"><b>${j.interviewing}<\/b><span>Interviewing<\/span><\/div>\n      ${RW.statusHTML(j.status)}\n      <div class=\"more-wrap\">\n        <button type=\"button\" class=\"more-btn\" aria-label=\"More actions for ${esc(j.title)}\" aria-haspopup=\"menu\" aria-expanded=\"false\" aria-controls=\"jm${i}\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"12\" r=\"1.8\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><circle cx=\"19\" cy=\"12\" r=\"1.8\"/><\/svg>\n        <\/button>\n        <div class=\"popover\" id=\"jm${i}\" role=\"menu\" aria-label=\"${esc(j.title)} actions\">\n          <a href=\"applicants?job=${encodeURIComponent(j.id)}\" class=\"menu-item\" role=\"menuitem\">View applicants<\/a>\n          <a href=\"jobs?id=${encodeURIComponent(j.id)}&amp;edit=1\" class=\"menu-item\" role=\"menuitem\">Edit posting<\/a>\n          <div class=\"menu-sep\" role=\"separator\"><\/div>\n          <a href=\"jobs?id=${encodeURIComponent(j.id)}&amp;delete=1\" class=\"menu-item danger\" role=\"menuitem\">Delete posting<\/a>\n        <\/div>\n      <\/div>\n    <\/div>`).join('') : '<div class=\"empty\">No active jobs. <a href=\"jobs?new=1\" style=\"color:var(--green-700);font-weight:600\">Post a job<\/a><\/div>';\n    $$('#postings .more-btn').forEach((b) => RW.setupPopover(b, document.getElementById(b.getAttribute('aria-controls'))));\n  }\n\n  /* ---------- Upcoming interviews: today in the panel, the rest of the week below ---------- */\n  function renderInterviews() {\n    const today = RW.ymdOf(RW.NOW);\n    const upcoming = RW.ownSlots().filter((s) => s.bookedBy && new Date(s.end) > RW.NOW).map((s) => ({ s, a: RW.application(s.bookedBy) })).filter((x) => x.a);\n    const todays = upcoming.filter((x) => RW.ymdOf(x.s.start) === today);\n    $('#ivToday').innerHTML = todays.length ? todays.map(({ s, a }) => `<a href=\"applicants?job=${encodeURIComponent(a.jobId)}#${esc(a.id)}\" class=\"iv-slot\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>\n        <span><b>${esc(RW.fmtRange(s.start, s.end))}<\/b><span>${esc(a.name)} · ${esc(a.job.title)}<\/span><\/span>\n        ${CHEV}\n      <\/a>`).join('') : '<p class=\"iv-none\">No interviews today.<\/p>';\n    const weekEnd = RW.NOW.getTime() + WEEK;\n    const later = upcoming.filter((x) => RW.ymdOf(x.s.start) !== today && new Date(x.s.start) < weekEnd);\n    const waiting = RW.awaitingBooking().length;\n    $('#ivLater').innerHTML = later.length\n      ? `<b>${later.length} more<\/b> this week · next ${esc(RW.fmt(later[0].s.start, { weekday: 'short' }))}, ${esc(RW.fmtTime(later[0].s.start))}`\n      : waiting ? `<b>${waiting}<\/b> applicant${waiting === 1 ? '' : 's'} still choosing a time` : 'Nothing else booked this week.';\n  }\n\n  /* ---------- Pipeline: one bar per status, across every job ---------- */\n  function renderPipeline() {\n    const apps = RW.allApplicants();\n    const P = [['Pending', '#C9CED2'], ['Interviewing', '#A893F0'], ['Accepted', '#4E9A68'], ['Rejected', '#F28B8B']].map(([label, color]) => ({ label, color, n: apps.filter((a) => a.status === label).length }));\n    const max = Math.max(1, ...P.map((p) => p.n));\n    const el = $('#pipeline');\n    const prev = new Map($$('.pipe-bar i', el).map((i) => [i.dataset.k, i.style.width]));\n    el.innerHTML = P.map((p) => `<a class=\"pipe-row\" href=\"applicants?status=${p.label}\" style=\"text-decoration:none\">\n        <span>${esc(p.label)}<\/span>\n        <span class=\"pipe-bar\"><i data-k=\"${p.label}\" style=\"background:${p.color};width:${prev.get(p.label) || 0}\" data-w=\"${(p.n / max) * 100}\"><\/i><\/span>\n        <b>${p.n}<\/b>\n      <\/a>`).join('');\n    requestAnimationFrame(() => requestAnimationFrame(() => $$('.pipe-bar i', el).forEach((i) => { i.style.width = i.dataset.w + '%'; })));\n  }\n\n  /* Desktop layout fits the viewport: drop trailing rows that would be cut off, never show half a row. */\n  function fitRows() {\n    $$('.rows').forEach((r) => {\n      const kids = [...r.children];\n      kids.forEach((c) => { c.hidden = false; });\n      if (getComputedStyle(r).overflowY !== 'hidden' || kids.length < 2) return;\n      const overflows = () => { const v = kids.filter((c) => !c.hidden).pop(); return v.offsetTop - r.offsetTop + v.offsetHeight > r.clientHeight + 1; };\n      for (let i = kids.length - 1; i > 0 && overflows(); i--) kids[i].hidden = true;\n    });\n  }\n\n  function renderAll(animate) {\n    renderWelcome(animate);\n    renderApplicants(animate);\n    renderPostings(animate);\n    renderInterviews();\n    renderPipeline();\n    fitRows();\n  }\n  renderAll(true);\n  RW.onChange(() => renderAll(false));\n  if (document.fonts) document.fonts.ready.then(fitRows);\n})();\n\n<\/script>\n<span id=\"mw-ready\" hidden><\/span>\n<\/body>\n<\/html>\n","jobs":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<script>\n['pushState','replaceState'].forEach(function(m){var o=History.prototype['__rw_'+m]||History.prototype[m];History.prototype['__rw_'+m]=o;History.prototype[m]=function(){try{return o.apply(this,arguments);}catch(e){}};});\n<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Matchwork – My Jobs<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n/* Matchwork candidate shell — shared by every candidate page.\n   Tokens and components follow DESIGN.md (\"The Greenhouse\"); the dashboard is the reference. */\n:root{\n  --bg:#FAFAFA; --surface:#FFFFFF; --sidebar:#FDFDFD;\n  --ink:#17191C; --ink-2:#3C4043; --muted:#5F6368; --muted-2:#6B7075;\n  --line:#F0F1F2; --line-2:#E2E4E6; --line-3:#ECEDEF; --row-line:#EFF0F1;\n  --green-900:#1F4D34; --green-800:#24553A; --green-700:#2F6B4A; --green-600:#3E7B5A; --green-500:#4E9A68;\ sition:fill .2s,stroke .2s}\n.save-btn:hover svg path{stroke:var(--green-700)}\n.save-btn[aria-pressed=\"true\"]{border-color:#CCDCD1;background:var(--green-75)}\n.save-btn[aria-pressed=\"true\"] svg path{fill:var(--green-600);stroke:var(--green-600)}\n.save-btn.pop svg{animation:pop .45s var(--ease-spring)}\n@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}\n.apply-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:100px;height:36px;padding:0 12px 0 14px;border:0;background:var(--green-700);color:#fff;font-size:14px;line-height:1;font-weight:600;letter-spacing:.2px;white-space:nowrap;cursor:pointer;overflow:hidden;transition:background-color .2s,transform .2s var(--ease),box-shadow .2s}\n.apply-btn .arrow{transition:transform .25s var(--ease)}\n.apply-btn:hover{background:var(--green-900);transform:translateY(-1px);box-shadow:0 6px 14px rgba(31,77,52,.22)}\n.apply-btn:hover .arrow{transform:translateX(3px)}\n.apply-btn:active{transform:translateY(0) scale(.97);box-shadow:none}\n.apply-btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}\n.apply-btn.loading{pointer-events:none}\n.apply-btn.applied{background:var(--green-100);color:var(--green-900);cursor:default;padding:0 12px}\n.apply-btn.applied:hover{transform:none;box-shadow:none;background:var(--green-100)}\n.apply-btn.applied .check{animation:pop .45s var(--ease-spring)}\n.apply-btn.lg{height:40px;min-width:120px;font-size:15px}\n\n/* ---------- Chips + segmented ---------- */\n.chips{position:relative;display:flex;flex-wrap:nowrap;gap:8px;min-width:0}\n.chip-indicator{position:absolute;left:0;top:0;height:32px;background:var(--chip-active);box-shadow:inset 0 0 0 1px #CFDFD4;pointer-events:none;transition:none}\n.ready .chip-indicator{transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}\n.r ic:tabular-nums}\n.filter-count.active{background:var(--green-100);color:var(--green-900)}\n.fp-label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}\n.fp-check{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;cursor:pointer}\n.fp-check input{width:16px;height:16px;margin:0;accent-color:var(--green-700);cursor:pointer}\n\n/* ---------- Job atoms ---------- */\n.logo-tile{flex:none;width:56px;height:56px;border:1px solid #E6E8EA;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease),box-shadow .3s}\n.logo-tile.sm{width:44px;height:44px}\n.logo-tile.sm img{transform:scale(.82)}\n.logo-tile.xs{width:36px;height:36px}\n.logo-tile.xs img{transform:scale(.64)}\n.mono{font-size:22px;font-weight:800;letter-spacing:-.5px}\n.logo-tile.sm.mono{font-size:18px}\n.logo-tile.xs.mono{font-size:15px}\n.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:13px;line-height:18px;color:var(--muted-2)}\n.meta svg{flex:none}\n.meta .type{color:var(--ink-2)}\n.tags{display:flex;flex-wrap:wrap;gap:8px}\n.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;line-height:21px;font-weight:500;color:var(--muted-2);background:#F4F4F6;border-radius:6px;padding:0 8px;white-space:nowrap}\n.tag.match{color:var(--green-900);background:#F1F4F2;font-weight:600;padding-left:6px}\n.score{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 13px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}\n.score.hi{background:var(--match-wash);color:var(--match-green);padding-left:11px}\n.score.mid{background:#F3F6F4;color:var(--match-green)}\n.score.lo{background:var(--honey-wash);color:var(--honey-ink)}\n\n/* Application status pills (status washes only) */\n.status{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 10px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap}\n.s nt-weight:600;text-underline-offset:3px}\n.jd-hint a:hover{color:var(--green-900)}\n.jd-section{border-top:1px solid var(--row-line);padding-top:18px}\n.jd-section h3{font-size:16px;line-height:20px;font-weight:700;margin-bottom:8px}\n.jd-section p,.jd-body li{font-size:14px;line-height:22px;color:var(--ink-2);max-width:64ch}\n.jd-lede{color:var(--ink)!important;font-weight:500}\n.jd-body p{margin-top:8px}\n.jd-body ul{margin:8px 0 0;padding-left:20px}\n.jd-body li::marker{color:var(--sage,#7FAE8E)}\n.jd-body li + li{margin-top:4px}\n.jd-co-meta{margin-top:8px}\n.jd-source .link-arrow{margin:8px 0 0 -9px}\n.jd-source p{color:var(--muted)}\n.jd.enter{animation:jdIn .35s var(--ease) both}\n@keyframes jdIn{from{opacity:0;transform:translateY(6px)}}\n\n/* Empty state */\n.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:20px}\n.empty svg{margin:0 auto 14px}\n.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}\n.empty .btn{margin-top:14px}\n\n/* Toast */\n.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;pointer-events:none}\n.toast{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--moss-ink);color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(12px) scale(.98);transition:opacity .2s,transform .3s var(--ease);white-space:nowrap}\n.toast.show{opacity:1;transform:none;pointer-events:auto}\n.toast.error{background:#3A1F1D}\n.toast button{border:0;background:rgba(255,255,255,.12);color:#CDE8D5;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer;transition:background-color .2s}\n.toast button:hover{background:rgba(255,255,255,.2)}\n\n/* ---------- Corner system (squircle where supported) ---------- */\n.nav-indicator,.nav-item,.icon-btn,.menu-item,.notif-item,.search-field,.search-btn,.filter-btn,.save-btn,.apply-btn,\n.btn,.link-arrow,.notif-head button,.seg button,.logo- 0,.6,1) both}\n  ::view-transition-new(mw-main){animation:mw-in .2s cubic-bezier(.2,.8,.2,1) both}\n}\n@keyframes mw-out{to{opacity:0}}\n@keyframes mw-in{from{opacity:0;transform:translateY(4px)}}\nhtml.mw-loading,html.mw-loading *{cursor:progress}\n\n/* ---------- Responsive shell ---------- */\n@media (max-width:1400px){\n  .sidebar{flex-basis:204px}\n  .brand,.portal-label{margin-left:28px}\n  .nav,.logout{margin-left:12px;margin-right:12px}\n  .nav-item{padding-left:14px;gap:12px}\n  .divider{margin-left:28px;margin-right:24px}\n  .deco-bl{width:204px}\n  .main{padding-left:22px}\n}\n@media (max-width:1180px), (max-height:620px){\n  .app{height:auto;min-height:100vh}\n  .scroll{overflow:visible}\n}\n@media (max-width:1180px){\n  .topbar-right{flex:0 0 auto}\n  .body{flex-wrap:wrap}\n  .col-right{flex:1 1 100%}\n}\n@media (max-width:860px){\n  .app{flex-direction:column}\n  .sidebar{flex:none;border-right:0;border-bottom:1px solid #EFEFEF;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}\n  .brand{margin:0 8px 0 4px}\n  .portal-label,.divider,.sidebar-spacer,.deco-bl,.nav-indicator,.deco-br{display:none}\n  .nav{flex-direction:row;margin:0}\n  .nav-item{height:40px;padding:0 12px;white-space:nowrap}\n  .nav-item[aria-current=\"page\"]{background:var(--green-75)}\n  .logout{margin:0}\n  .main{padding:12px}\n  .bell-wrap{margin-right:4px}\n}\n@media (max-width:700px){\n  .search-field.loc,.search-sep{display:none}\n  .topbar{gap:10px}\n}\n@media (max-width:520px){\n  .account-btn .chev{display:none}\n  .search-btn{padding:0 12px;margin-left:4px}\n  .search-field{gap:8px;padding-left:8px}\n  .topbar-right{gap:4px}\n}\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}\n}\n\n<\/style>\n<style>\n/* Matchwork employer pages: list + detail layouts, forms and atoms shared by My Jobs, Applicants,\n   Interviews and Company Profile. Built on ../candidate/assets/shell.css (DESIGN.md, \"The Greenhouse\"). */\n\n/* ---------- Browser surfaces ---------- */\n::selection{background:#D6E7DB;color:var(--ink)}\n.scroll::-webkit-scrollbar{width:8px}\n.scroll::-webkit-scrollbar-thumb{background:#DADFDB;border-radius:4px}\n.scroll::-webkit-scrollbar-track{background:transparent}\n\n/* ---------- Top bar: one search field with a shortcut hint ---------- */\n\n/* ---------- People ---------- */\n.person-av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink-2)}\n.person-av.lg{width:56px;height:56px;font-size:19px}\n\n/* ---------- List page: one card with head, filters, table header and a scrolling list ---------- */\n.list-page{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:16px 0 0}\n.list-page .page-head{padding:0 22px 0 23px;align-items:flex-start}\n.page-head .btn{margin-top:2px}\n.toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:14px 22px 0 23px}\n.toolbar .chips{flex:1 1 auto;overflow-x:auto;scrollbar-width:none;padding:1px}\n.thead{flex:none;display:grid;column-gap:16px;align-items:center;margin:14px 14px 0;padding:0 10px 8px;border-bottom:1px solid var(--row-line);font-size:12px;font-weight:600;color:var(--muted)}\n.list{flex:1 1 auto;min-height:0;padding:4px 14px 12px}\n.lrow{position:relative;display:grid;column-gap:16px;align-items:center;width:100%;padding:12px 10px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font-size:13px;border-radius:calc(var(--r-md) * var(--sq));transition:background-color .2s}\n.lrow + .lrow::after{content:\"\";position:absolute;left:10px;right:10px;top:0;height:1px;background:var(--row-line)}\n.lrow:hover{background:#FAFBFA}\n.lrow[aria-current=\"true\"]{background:#F3F7F4}\n.lrow[aria-current=\"true\"]::after,.lrow[aria-current=\"true\"] + .lrow:: (function (root) {\n  'use strict';\n\n  function normalizeSkills(list) {\n    const out = new Set();\n    (list || []).forEach((s) => {\n      const k = String(s == null ? '' : s).trim().toLowerCase();\n      if (k) out.add(k);\n    });\n    return out;\n  }\n\n  function matchScore(candidateSkills, requiredSkills) {\n    const C = normalizeSkills(candidateSkills);\n    const R = normalizeSkills(requiredSkills);\n    if (R.size === 0) return 100;\n    let hit = 0;\n    R.forEach((s) => { if (C.has(s)) hit++; });\n    return Math.floor((100 * hit) / R.size);\n  }\n\n  function hasSkill(candidateSkills, skill) {\n    return normalizeSkills(candidateSkills).has(String(skill == null ? '' : skill).trim().toLowerCase());\n  }\n\n  const lc = (s) => String(s == null ? '' : s).toLowerCase();\n  const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);\n\n  /* Candidate dashboard: score desc, then case-insensitive job title, then stable job id. */\n  function compareJobs(a, b) {\n    return (b.match - a.match) || cmp(lc(a.title), lc(b.title)) || cmp(a.seq != null ? a.seq : a.id, b.seq != null ? b.seq : b.id);\n  }\n\n  /* Employer applicants: score desc, then case-insensitive display name, then stable candidate id. */\n  function compareApplicants(a, b) {\n    return (b.match - a.match) || cmp(lc(a.name), lc(b.name)) || cmp(String(a.candidateId), String(b.candidateId));\n  }\n\n  root.MWMatch = Object.freeze({ normalizeSkills, matchScore, hasSkill, compareJobs, compareApplicants });\n})(window);\n\n<\/script>\n<script>\n/* Matchwork employer portal: demo store, business rules and app shell.\n   Front-end only. Every mutating call returns { ok, code, message } with the HTTP status the\n   full-stack API must return (400 / 403 / 404 / 409), so the UI already handles the real contract.\n   Matching comes from /shared/match.js, the same implementation the candidate portal calls. */\n(function () {\n  'use strict';\n\n  /* ---------- Demo session ----------\n     login.html stores { r  0 C200 20 150 40 120 70 C95 95 60 110 0 120 L230 120Z\" fill=\"#F2F3F3\"/><path d=\"M230 30 C205 55 180 80 140 100 C120 110 100 116 80 120 L230 120Z\" fill=\"#ECEEEE\"/><\/svg>\n  <aside class=\"sidebar\" id=\"sidebar\"><\/aside>\n  <main class=\"main\">\n    <div class=\"topbar\" id=\"topbar\"><\/div>\n    <script>RW.renderChrome('jobs');<\/script>\n    <div class=\"body\">\n      <div class=\"col-left\">\n        <section class=\"card list-page\" aria-labelledby=\"jobs-title\">\n          <div class=\"page-head\">\n            <div>\n              <h1 id=\"jobs-title\">My jobs<\/h1>\n              <p>Create and edit your postings. Close a job to stop new applications; jobs with applicants can't be deleted.<\/p>\n            <\/div>\n            <a class=\"btn btn-primary\" href=\"jobs?new=1\" id=\"newJob\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg>Post a job\n            <\/a>\n          <\/div>\n          <div class=\"toolbar\">\n            <div class=\"chips\" id=\"tabs\" role=\"group\" aria-label=\"Filter by posting status\"><span class=\"chip-indicator\" aria-hidden=\"true\"><\/span><\/div>\n          <\/div>\n          <div class=\"thead\" aria-hidden=\"true\"><span>Job<\/span><span>Applicants<\/span><span class=\"c-iv\">Interviewing<\/span><span>Status<\/span><span><\/span><\/div>\n          <div class=\"list scroll\" id=\"list\" aria-live=\"polite\"><\/div>\n        <\/section>\n      <\/div>\n      <div class=\"col-right\">\n        <section class=\"card rail\" id=\"rail\" aria-label=\"Job details\"><\/section>\n      <\/div>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n(() => {\n  'use strict';\n  const { $, $$, esc, ICON } = RW;\n  const FILTERS = ['All', 'Active', 'Closed'];\n  const qs = RW.params();\n  const st = {\n    filter: FILTERS.includes(qs.get('status')) ? qs.get('status') : 'All',\n    sel: qs.get('id') || RW.hash() || null,\n    mode: qs.get('new') ? 'new' : qs.get('edit') ? 'edit' : 'view',\n    confirm: !!qs.get('delete'),\n    dirty: false,\n  };\n\n  RW.mountShell('jobs', { onLayout: () => syncTabs() });\n\n  const tabsEl = $('#tabs'), ind = $('.chip-indicator', tabsEl), listEl = $('#list'), rail = $('#rail');\n  const syncTabs = () => RW.moveIndicator(ind, $('.chip[aria-pressed=\"true\"]', tabsEl), true);\n  const visible = () => RW.jobs().filter((j) => st.filter === 'All' || j.status === st.filter);\n\n  /* Keep the URL in step with what is on screen, so reload and Back land in the same place. */\n  function syncURL() {\n    const u = RW.url();\n    ['id', 'new', 'edit', 'delete'].forEach((k) => u.searchParams.delete(k));\n    st.filter === 'All' ? u.searchParams.delete('status') : u.searchParams.set('status', st.filter);\n    if (st.mode === 'new') u.searchParams.set('new', '1');\n    else if (st.sel) { u.searchParams.set('id', st.sel); if (st.mode === 'edit') u.searchParams.set('edit', '1'); }\n    u.hash = '';\n    history.replaceState(null, '', u);\n  }\n\n  function renderTabs() {\n    const all = RW.jobs();\n    tabsEl.querySelectorAll('.chip').forEach((c) => c.remove());\n    FILTERS.forEach((f) => {\n      const n = f === 'All' ? all.length : all.filter((j) => j.status === f).length;\n      const b = document.createElement('button');\n      b.type = 'button'; b.className = 'chip';\n      b.setAttribute('aria-pressed', String(f === st.filter));\n      b.innerHTML = `<span>${esc(f)}<\/span><span class=\"count\">${n}<\/span>`;\n      b.addEventListener('click', () => {\n        if (st.filter === f || !leaveEditor()) return;\n        st.filter = f;\n        $$('.chip', tabsEl).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n        syncTabs(); renderList(true);\n      });\n      tabsEl.appendChild(b);\n    });\n    syncTabs();\n  }\n\n  function rowHTML(j) {\n    return `<button type=\"button\" class=\"lrow jrow${j.status === 'Closed' ? ' closed' : ''}\" data-id=\"${esc(j.id)}\" aria-label=\"${esc(j.title)}, ${j.apps} applicant${j.apps === 1 ? '' : 's'}${j.pending ? `, ${j.pending} to review` : ''}, ${j.interviewing} interviewing, ${esc(j.status)}\" aria-current=\"${j.id === st.sel && st.mode !== 'new'}\">\n      ${RW.logoHTML('sm')}\n      <span style=\"min-width:0\"><h3>${esc(j.title)}<\/h3><span class=\"meta\"><span class=\"type\">${esc(j.type)}<\/span><span aria-hidden=\"true\">·<\/span><span>${esc(j.location)}<\/span><span class=\"posted\"><span aria-hidden=\"true\">·<\/span> Posted ${esc(RW.fmtShort(j.posted))}<\/span><\/span><\/span>\n      <span class=\"count c-apps${j.apps ? '' : ' zero'}\">${j.apps}${j.pending ? `<span class=\"review\">${j.pending} to review<\/span>` : ''}<\/span>\n      <span class=\"count c-iv${j.interviewing ? '' : ' zero'}\">${j.interviewing}<\/span>\n      <span class=\"st${j.status === 'Active' ? ' is-active' : ''}\">${RW.statusHTML(j.status)}<\/span>\n      <span class=\"chev\">${ICON.chev}<\/span>\n    <\/button>`;\n  }\n\n  function renderList(animate, flashId) {\n    const list = visible();\n    if (!list.length) {\n      listEl.innerHTML = st.filter === 'All'\n        ? `<div class=\"empty\"><strong>No jobs yet<\/strong>Post your first job and matched candidates can apply.<br><a class=\"btn btn-primary\" href=\"jobs?new=1\">Post a job<\/a><\/div>`\n        : `<div class=\"empty\"><strong>No ${esc(st.filter.toLowerCase())} jobs<\/strong>${st.filter === 'Closed' ? 'Jobs you close stop taking applications and show up here.' : 'Reopen a closed job or post a new one.'}<\/div>`;\n      if (st.mode === 'view') { st.sel = null; renderRail(); }\n      return;\n    }\n    if (st.mode !== 'new' && !list.some((j) => j.id === st.sel)) { st.sel = list[0].id; if (st.mode === 'edit') st.mode = 'view'; }\n    listEl.innerHTML = list.map(rowHTML).join('');\n    if (animate && !RW.reduceMotion) $$('.lrow', listEl).forEach((el, i) => { el.style.animationDelay = Math.min(i, 8) * 40 + 'ms'; el.classList.add('enter'); });\n    if (flashId) { const r = $(`.lrow[data-id=\"${CSS.escape(flashId)}\"]`, listEl); if (r) { r.classList.add('flash'); r.scrollIntoView({ block: 'nearest' }); } }\n    renderRail(false);\n  }\n\n  /* ---------- Rail: job detail ---------- */\n  function detailHTML(j) {\n    const reqs = j.skills.length\n      ? `<div class=\"req\">${j.skills.map((s) => `<span class=\"tag\">${esc(s)}<\/span>`).join('')}<\/div>`\n      : `<p class=\"ad-text\">No required skills, so every applicant scores 100%.<\/p>`;\n    return `<div class=\"ad scroll\" data-id=\"${esc(j.id)}\">\n      <div class=\"ad-head\">${RW.logoHTML('sm')}<div style=\"min-width:0\"><h2>${esc(j.title)}<\/h2><div class=\"meta\"><span class=\"type\">${esc(j.type)}<\/span><span aria-hidden=\"true\">·<\/span><span>${esc(j.location)}<\/span><\/div><\/div><\/div>\n      <div class=\"ad-facts\">${RW.statusHTML(j.status)}<span class=\"facts-line\"><b>${j.apps}<\/b> applicant${j.apps === 1 ? '' : 's'} · <b>${j.interviewing}<\/b> interviewing · posted ${esc(RW.fmtShort(j.posted))}<\/span><\/div>\n      <div class=\"ad-actions\" id=\"actions\">\n        <a class=\"btn btn-primary\" href=\"applicants?job=${encodeURIComponent(j.id)}\">View applicants<\/a>\n        <button type=\"button\" class=\"btn btn-secondary\" data-act=\"edit\">${ICON.edit}Edit<\/button>\n      <\/div>\n      <div><div class=\"ad-sub\">Required skills<\/div>${reqs}<\/div>\n      <div><div class=\"ad-sub\">About the role<\/div><div class=\"ad-body\"><p class=\"jd-lede\">${esc(j.desc)}<\/p>${RW.bodyHTML(j.body)}<\/div><\/div>\n      <div class=\"manage\">\n        <div id=\"confirmSlot\"><\/div>\n        <div class=\"manage-row\">\n          <button type=\"button\" class=\"btn btn-quiet\" data-act=\"toggle\">${j.status === 'Active' ? 'Close posting' : 'Reopen posting'}<\/button>\n          <button type=\"button\" class=\"btn btn-danger-quiet\" data-act=\"delete\">${ICON.trash}Delete<\/button>\n        <\/div>\n      <\/div>\n    <\/div>`;\n  }\n\n  function confirmHTML(j) {\n    const b = RW.deleteBlockers(j.id);\n    if (b.blocked) {\n      return `<div class=\"note honey enter\" role=\"alert\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v5M12 16.5v.5\"/><\/svg>\n        <div><b>This job can't be deleted.<\/b> It has ${b.apps} application${b.apps === 1 ? '' : 's'}, and their status and interview history stay with it. Close the posting to stop new applications.\n        <div class=\"btns\">${j.status === 'Active' ? '<button type=\"button\" class=\"btn btn-secondary\" data-act=\"close-instead\">Close posting<\/button>' : ''}<button type=\"button\" class=\"btn btn-quiet\" data-act=\"cancel\">Keep it<\/button><\/div><\/div><\/div>`;\n    }\n    return `<div class=\"note danger enter\" role=\"alert\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg>\n      <div><b>Delete “${esc(j.title)}”?<\/b> It has no applicants or interview slots. This can't be undone.\n      <div class=\"btns\"><button type=\"button\" class=\"btn btn-danger\" data-act=\"confirm-delete\">Delete posting<\/button><button type=\"button\" class=\"btn btn-quiet\" data-act=\"cancel\">Cancel<\/button><\/div><\/div><\/div>`;\n  }\n\n  /* ---------- Rail: create / edit form ---------- */\n  let draftSkills = [];\n  function editorHTML(j) {\n    const v = j || { title: '', location: '', type: 'Full-time', status: 'Active', desc: '', body: '', skills: [] };\n    const seg = (name, options, cur) => `<div class=\"seg\" role=\"group\" aria-label=\"${name}\" data-seg=\"${name}\">${options.map((o) => `<button type=\"button\" aria-pressed=\"${o === cur}\" data-v=\"${esc(o)}\">${esc(o)}<\/button>`).join('')}<\/div>`;\n    return `<form class=\"editor scroll\" id=\"editor\" novalidate>\n      <div class=\"editor-head\"><h2>${j ? 'Edit job' : 'Post a job'}<\/h2>${j ? RW.statusHTML(j.status) : ''}<\/div>\n      <div class=\"form one\">\n        <div class=\"field\"><label for=\"fTitle\">Job title <i aria-hidden=\"true\">*<\/i><\/label>\n          <input class=\"input\" id=\"fTitle\" name=\"title\" maxlength=\"90\" value=\"${esc(v.title)}\" placeholder=\"e.g. Backend Engineer, Catalog API\" aria-describedby=\"eTitle\" required>\n          <span class=\"err\" id=\"eTitle\"><\/span><\/div>\n        <div class=\"field\"><label for=\"fLoc\">Location<\/label>\n          <input class=\"input\" id=\"fLoc\" name=\"location\" maxlength=\"60\" value=\"${esc(v.location)}\" placeholder=\"City, state, or Remote\"><\/div>\n        <div class=\"field\"><span class=\"lbl\" id=\"lType\">Job type<\/span>${seg('Job type', RW.JOB_TYPES, v.type)}<\/div>\n        <div class=\"field\"><label for=\"fDesc\">Summary <i aria-hidden=\"true\">*<\/i><\/label>\n          <input class=\"input\" id=\"fDesc\" name=\"desc\" maxlength=\"160\" value=\"${esc(v.desc)}\" placeholder=\"One line on what this person will do\" aria-describedby=\"eDesc hDesc\" required>\n          <small id=\"hDesc\">Candidates see this first, on every job card.<\/small>\n          <span class=\"err\" id=\"eDesc\"><\/span><\/div>\n        <div class=\"field\"><label for=\"fBody\">Details<\/label>\n          <textarea class=\"input\" id=\"fBody\" name=\"body\" rows=\"5\" maxlength=\"2000\" placeholder=\"Responsibilities, team, what success looks like\" aria-describedby=\"hBody\">${esc(v.body)}<\/textarea>\n          <small id=\"hBody\">Start a line with “- ” to make it a bullet.<\/small><\/div>\n        <div class=\"field\"><label for=\"fSkill\">Required skills<\/label>\n          <div class=\"skill-box\" id=\"skillBox\"><input id=\"fSkill\" placeholder=\"Type a skill, press Enter\" aria-describedby=\"hSkill\" autocomplete=\"off\"><\/div>\n          <small id=\"hSkill\">An applicant's match score is the share of these skills they list. Leave it empty and everyone scores 100%.<\/small><\/div>\n        ${j ? `<div class=\"field\"><span class=\"lbl\">Posting status<\/span>${seg('Posting status', ['Active', 'Closed'], v.status)}<small>Closed jobs stay visible to you but stop taking applications.<\/small><\/div>` : ''}\n        <div class=\"form-actions\">\n          <button type=\"button\" class=\"btn btn-quiet\" data-act=\"cancel-edit\">Cancel<\/button>\n          <button type=\"submit\" class=\"btn btn-primary\" id=\"saveJob\" title=\"Ctrl+Enter\">${j ? 'Save changes' : 'Post job'}<\/button>\n        <\/div>\n      <\/div>\n    <\/form>`;\n  }\n\n  function wireEditor(j) {\n    const form = $('#editor'), box = $('#skillBox'), input = $('#fSkill');\n    draftSkills = j ? j.skills.slice() : [];\n    const drawSkills = (added) => {\n      $$('.sk', box).forEach((x) => x.remove());\n      draftSkills.forEach((s) => {\n        const el = document.createElement('span');\n        el.className = 'sk' + (s === added ? ' new' : '');\n        el.innerHTML = `${esc(s)}<button type=\"button\" aria-label=\"Remove ${esc(s)}\">${ICON.x}<\/button>`;\n        el.querySelector('button').addEventListener('click', () => { draftSkills = draftSkills.filter((x) => x !== s); st.dirty = true; drawSkills(); input.focus(); });\n        box.insertBefore(el, input);\n      });\n    };\n    const addSkill = () => {\n      const parts = input.value.split(',').map((s) => s.trim()).filter(Boolean);\n      if (!parts.length) return false;\n      let last = null;\n      parts.forEach((p) => { if (!draftSkills.some((x) => x.toLowerCase() === p.toLowerCase())) { draftSkills.push(p); last = p; } });\n      input.value = ''; st.dirty = true; drawSkills(last);\n      return true;\n    };\n    drawSkills();\n    box.addEventListener('click', (e) => { if (e.target === box) inp eY(0) scale(.97);box-shadow:none}\n.apply-btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}\n.apply-btn.loading{pointer-events:none}\n.apply-btn.applied{background:var(--green-100);color:var(--green-900);cursor:default;padding:0 12px}\n.apply-btn.applied:hover{transform:none;box-shadow:none;background:var(--green-100)}\n.apply-btn.applied .check{animation:pop .45s var(--ease-spring)}\n.apply-btn.lg{height:40px;min-width:120px;font-size:15px}\n\n/* ---------- Chips + segmented ---------- */\n.chips{position:relative;display:flex;flex-wrap:nowrap;gap:8px;min-width:0}\n.chip-indicator{position:absolute;left:0;top:0;height:32px;background:var(--chip-active);box-shadow:inset 0 0 0 1px #CFDFD4;pointer-events:none;transition:none}\n.ready .chip-indicator{transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}\n.ready .nav-indicator{transition:transform .15s cubic-bezier(.22,1,.36,1)}\n.chip{position:relative;flex:none;height:32px;padding:0 14px;border:1px solid var(--line-2);background:transparent;color:#2A2F33;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .18s ease,color .18s ease,background-color .18s ease}\n.chip:hover{border-color:#D8DEDA;background:#F6F7F7;color:var(--ink)}\n.chip[aria-pressed=\"true\"],.chip[aria-selected=\"true\"]{border-color:transparent;background:transparent;color:var(--green-900);-webkit-text-stroke:.3px currentColor;cursor:default}\n.chip .count{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;-webkit-text-stroke:0}\n.chip[aria-pressed=\"true\"] .count,.chip[aria-selected=\"true\"] .count{color:var(--green-800)}\n.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:#F2F4F3}\n.seg button{height:28px;padding:0 10px;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s,box-shadow .15s}\n.seg button:hover{color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{background:#fff;color:var(--green-900);font-weight:600;box-shadow:0 1px 2px rgba(23,25,28,.08)}\n.filter-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 12px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(23,25,28,.04);transition:border-color .18s ease,background-color .18s ease}\n.filter-btn:hover{border-color:#C9D2CC;background:#FAFBFA}\n.filter-btn[aria-expanded=\"true\"]{border-color:#C9D3CC;background:#F6F7F7}\n.filter-count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#EEF0EF;color:var(--ink-2);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}\n.filter-count.active{background:var(--green-100);color:var(--green-900)}\n.fp-label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}\n.fp-check{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;cursor:pointer}\n.fp-check input{width:16px;height:16px;margin:0;accent-color:var(--green-700);cursor:pointer}\n\n/* ---------- Job atoms ---------- */\n.logo-tile{flex:none;width:56px;height:56px;border:1px solid #E6E8EA;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease),box-shadow .3s}\n.logo-tile.sm{width:44px;height:44px}\n.logo-tile.sm img{transform:scale(.82)}\n.logo-tile.xs{width:36px;height:36px}\n.logo-tile.xs img{transform:scale(.64)}\n.mono{font-size:22px;font-weight:800;letter-spacing:-.5px}\n.logo-tile.sm.mono{font-size:18px}\n.logo-tile.xs.mono{font-size:15px}\n.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:13px;line-height:18px;color:var(--muted-2)}\n.meta svg{flex:none}\n.meta .type{color: n:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;pointer-events:none}\n.toast{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--moss-ink);color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(12px) scale(.98);transition:opacity .2s,transform .3s var(--ease);white-space:nowrap}\n.toast.show{opacity:1;transform:none;pointer-events:auto}\n.toast.error{background:#3A1F1D}\n.toast button{border:0;background:rgba(255,255,255,.12);color:#CDE8D5;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer;transition:background-color .2s}\n.toast button:hover{background:rgba(255,255,255,.2)}\n\n/* ---------- Corner system (squircle where supported) ---------- */\n.nav-indicator,.nav-item,.icon-btn,.menu-item,.notif-item,.search-field,.search-btn,.filter-btn,.save-btn,.apply-btn,\n.btn,.link-arrow,.notif-head button,.seg button,.logo-tile,.r-sm{border-radius:calc(var(--r-sm) * var(--sq))}\n.panel,.seg,.toast button,.r-md{border-radius:calc(var(--r-md) * var(--sq))}\n.search,.chip,.chip-indicator,.toast,.r-lg{border-radius:calc(var(--r-lg) * var(--sq))}\n.popover,.card{border-radius:calc(var(--r-xl) * var(--sq))}\n.seg button{border-radius:calc((var(--r-md) - 3px) * var(--sq))}\n.logo-tile.xs{border-radius:calc(10px * var(--sq))}\n@supports (corner-shape: squircle){\n  :root{--sq:1.6}\n  .nav-indicator,.nav-item,.icon-btn,.menu-item,.notif-item,.search,.search-field,.search-btn,.filter-btn,.save-btn,.apply-btn,\n  .btn,.link-arrow,.notif-head button,.seg,.seg button,.logo-tile,.panel,.toast,.toast button,.chip,.chip-indicator,\n  .popover,.card,.r-sm,.r-md,.r-lg{corner-shape:squircle}\n}\n\n\n/* ---------- Tab switching ----------\n   Pages are separate documents. Cross-document view transitions keep the sidebar and\n   top bar still and only cross-fade the content; browsers without support just navigate. */\nhtml{background:var(--bg)}\n.app{zoom:var(--mw-zoom,1);height:calc(100vh / var(--mw-zoom,1));height:calc(100dvh / var(--mw-zoom,1))}\n.topbar{position:relative;z-index:5}\n@media (prefers-reduced-motion:no-preference){\n  @view-transition{navigation:auto}\n  .sidebar{view-transition-name:mw-sidebar}\n  .topbar{view-transition-name:mw-topbar}\n  .main{view-transition-name:mw-main}\n  ::view-transition-old(root),::view-transition-new(root){animation:none}\n  ::view-transition-group(mw-sidebar),::view-transition-group(mw-topbar),::view-transition-group(mw-main){animation:none}\n  ::view-transition-old(mw-sidebar),::view-transition-old(mw-topbar){display:none}\n  ::view-transition-new(mw-sidebar),::view-transition-new(mw-topbar){animation:none}\n  /* Crossfade with no dip: the new page fades in faster than the old one fades out, and the\n     pair blends with plus-lighter, so the background never shows through mid-switch. */\n  ::view-transition-old(mw-main){animation:mw-out .2s cubic-bezier(.4,0,.6,1) both}\n  ::view-transition-new(mw-main){animation:mw-in .2s cubic-bezier(.2,.8,.2,1) both}\n}\n@keyframes mw-out{to{opacity:0}}\n@keyframes mw-in{from{opacity:0;transform:translateY(4px)}}\nhtml.mw-loading,html.mw-loading *{cursor:progress}\n\n/* ---------- Responsive shell ---------- */\n@media (max-width:1400px){\n  .sidebar{flex-basis:204px}\n  .brand,.portal-label{margin-left:28px}\n  .nav,.logout{margin-left:12px;margin-right:12px}\n  .nav-item{padding-left:14px;gap:12px}\n  .divider{margin-left:28px;margin-right:24px}\n  .deco-bl{width:204px}\n  .main{padding-left:22px}\n}\n@media (max-width:1180px), (max-height:620px){\n  .app{height:auto;min-height:100vh}\n  .scroll{overflow:visible}\n}\n@media (max-width:1180px){\n  .topbar-right{flex:0 0 auto}\n  .body{flex-wrap:wrap}\n  .col-right{flex:1 1 100%}\n}\n@media (max-width:860px){\n  .app{flex-direction:column}\n  .sidebar{flex:none;border-right:0;border-bottom:1px solid #EFEFEF;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-widt p(a.seq != null ? a.seq : a.id, b.seq != null ? b.seq : b.id);\n  }\n\n  /* Employer applicants: score desc, then case-insensitive display name, then stable candidate id. */\n  function compareApplicants(a, b) {\n    return (b.match - a.match) || cmp(lc(a.name), lc(b.name)) || cmp(String(a.candidateId), String(b.candidateId));\n  }\n\n  root.MWMatch = Object.freeze({ normalizeSkills, matchScore, hasSkill, compareJobs, compareApplicants });\n})(window);\n\n<\/script>\n<script>\n/* Matchwork employer portal: demo store, business rules and app shell.\n   Front-end only. Every mutating call returns { ok, code, message } with the HTTP status the\n   full-stack API must return (400 / 403 / 404 / 409), so the UI already handles the real contract.\n   Matching comes from /shared/match.js, the same implementation the candidate portal calls. */\n(function () {\n  'use strict';\n\n  /* ---------- Demo session ----------\n     login.html stores { role } on sign-in. Employer pages need role \"recruiter\" when served over\n     http(s); file:// previews skip the check. Log Out clears the flag. */\n  const SESSION_KEY = 'mw-session';\n  /* Single-file build (matchwork-recruiter.html): every page lives in window.__RW_PAGES. */\n  const BUNDLE = !!window.__RW_PAGES;\n  /* Where pages read their query and hash. In the bundle, if the browser refused to change the URL\n     (file:// in some browsers, sandboxed previews) the router keeps the intended one in __rwLoc. */\n  const loc = () => (BUNDLE && window.__rwLoc) || { search: location.search, hash: location.hash };\n  const params = () => new URLSearchParams(loc().search);\n  const hash = () => loc().hash.slice(1);\n  /* The page's current URL, to edit and hand to history.replaceState. */\n  const url = () => { const l = loc(); return new URL(location.pathname + l.search + l.hash, location.href); };\n  function hasRecruiterSession() {\n    let ok = true;\n    try {\n      const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);\n      let role = null; try { role = raw && JSON.parse(raw).role; } catch (e) { /* malformed */ }\n      ok = role === 'recruiter';\n    } catch (e) { /* storage blocked: let them in */ }\n    return ok;\n  }\n  const hosted = !BUNDLE && /^https?:$/.test(location.protocol);\n  if (hosted) {\n    if (!hasRecruiterSession()) location.replace('/login#recruiter');\n    document.addEventListener('click', (e) => {\n      const a = e.target.closest && e.target.closest('a[href^=\"/login\"]');\n      if (!a) return;\n      try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (err) { /* nothing stored */ }\n    }, true);\n  }\n\n  const { normalizeSkills, matchScore, hasSkill, compareApplicants } = window.MWMatch;\n\n  /* ---------- Utilities ---------- */\n  const $ = (s, r = document) => r.querySelector(s);\n  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));\n  const esc = (s) => String(s == null ? '' : s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  /* All times are stored in UTC and shown in Pacific Time, like the candidate portal. */\n  const TZ = 'America/Los_Angeles';\n  const TZ_LABEL = 'Pacific Time (PT)';\n  /* The demo clock, shared with the candidate portal: Monday, Nov 16 2026, 9:00 AM PT. */\n  const NOW = new Date('2026-11-16T17:00:00Z');\n  const SLOT_MIN = 30;\n  const fmt = (d, opts) => new Intl.DateTimeFormat('en-US', { timeZone: TZ, ...opts }).format(new Date(d));\n  const fmtDate = (d) => fmt(d, { weekday: 'short', month: 'short', day: 'numeric' });\n  const fmtLong = (d) => fmt(d, { weekday: 'long', month: 'long', day: 'numeric' });\n  const fmtShort = (d) => fmt(d, { month: 'short', day: 'numeric' });\n  const fmtTime = (d) => fmt(d, { hour: 'numeric', minute: '2-digit' });\n  function fmtRange(s, e) {\n    const a = fm
