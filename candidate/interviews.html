<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchwork – Interviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<link rel="expect" href="#mw-ready" blocking="render">
<script src="../shared/html.js"></script>
<script src="../shared/match.js"></script>
<script src="assets/matchwork.js"></script>
<style>
.col-left.scroll{padding-right:2px}
.col-left > .card{flex:none}
.sec{padding:16px 22px 18px 23px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.sec-head h2{font-size:18px;line-height:24px;font-weight:700}
.sec-head p{margin-top:2px;font-size:14px;line-height:20px;color:#555A60}
.tz{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tz svg{color:var(--muted)}

/* Booking */
.bk-job{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:center;margin-top:14px}
.bk-job h3{font-size:16px;line-height:20px;font-weight:700}
.bk-label{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.day{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px 8px;border:1px solid var(--line-2);background:#fff;cursor:pointer;transition:border-color .18s,background-color .18s,color .18s}
.day:hover{border-color:#D8DEDA;background:#F6F7F7}
.day .dw{font-size:12px;font-weight:600;color:var(--muted)}
.day .dn{font-size:20px;line-height:24px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.day .dc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--green-75);border-color:#CFDFD4;color:var(--green-900)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dc{color:var(--green-800)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.slot{position:relative}
.slot input{position:absolute;opacity:0;pointer-events:none}
.slot span{display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--line-2);background:#fff;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;transition:border-color .18s,background-color .18s,color .18s,transform .15s}
.slot span:hover{border-color:#B8CBBE;background:var(--green-50)}
.slot input:checked + span{background:var(--chip-active);border-color:#CFDFD4;color:var(--green-900)}
.slot input:focus-visible + span{outline:2px solid var(--green-600);outline-offset:2px}
.slot input:active + span{transform:scale(.97)}
.slot.gone span{animation:gone .5s var(--ease) both}
@keyframes gone{30%{transform:translateX(-3px)}60%{transform:translateX(3px)}100%{opacity:.35}}
.bk-msg{margin-top:12px;padding:10px 12px;background:var(--honey-wash);color:var(--honey-ink);font-size:13.5px;line-height:19px;font-weight:500}
.bk-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:16px;padding:12px 12px 12px 16px}
.bk-bar p{font-size:14px;line-height:20px;color:var(--ink-2)}
.bk-bar p b{color:var(--ink)}
.bk-bar .btn{min-width:150px}
.bk-done{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px}
.bk-done .ok{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green-500);display:flex;align-items:center;justify-content:center;animation:pop .45s var(--ease-spring)}
.bk-done strong{display:block;font-size:15px}
.bk-done span{font-size:13.5px;color:var(--ink-2)}

/* Interview rows */
.ivs{margin-top:12px}
.ivr{display:grid;grid-template-columns:58px minmax(0,1fr) auto;column-gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--row-line)}
.leaf{width:58px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green-50);border:1px solid #EEF0F0}
.leaf .m{font-size:12px;font-weight:600;color:var(--muted)}
.leaf .d{font-size:22px;line-height:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ivr.past .leaf{background:#F6F6F7;border-color:#EEEFF0}
.ivr.past .leaf .d{color:var(--ink-2)}
.ivr h3{font-size:16px;line-height:20px;font-weight:700}
.ivr .meta{margin-top:3px}
.ivr .when{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:13px;color:#2A2F33;font-variant-numeric:tabular-nums}
.ivr .when span{display:flex;align-items:center;gap:6px}
.ivr .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.soon{font-size:12.5px;font-weight:600;color:var(--green-800);background:var(--green-100);padding:0 9px;line-height:24px;border-radius:12px;font-variant-numeric:tabular-nums}
.ivr.enter{animation:rowIn .45s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
.empty-inline{margin-top:12px;padding:20px;border-top:1px solid var(--row-line);font-size:14px;color:var(--muted)}

/* Rail calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:32px;height:32px;border:0;background:transparent;border-radius:calc(10px * var(--sq));cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.cal-nav button:hover{background:#F0F1F1}
.cal-nav button:disabled{color:#C3C8C5;cursor:default;background:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.cal .c{position:relative;height:36px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.cal .c.out{color:#C3C8C5}
.cal .c b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:inherit}
.cal .c.today b{box-shadow:inset 0 0 0 1.5px var(--ink-2);color:var(--ink);font-weight:700}
.cal .c.open::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--sage-mark,#7FAE8E)}
.cal .c.iv b{background:var(--green-700);color:#fff;font-weight:700}
.cal .c.ivpast b{background:#E4E7E5;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:19px;color:var(--ink-2)}
.rules li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.rules svg{margin-top:1px}

@media (max-height:720px){ .sec{padding:14px 20px 14px} .cal .c{height:32px} .cal .c b{width:28px;height:28px} }
@media (max-width:1180px){ .col-right{flex-direction:row;flex-wrap:wrap} .col-right > *{flex:1 1 300px} }
@media (max-width:560px){
  .ivr{grid-template-columns:52px minmax(0,1fr)}
  .ivr .side{grid-column:2;flex-direction:row;align-items:center;margin-top:8px}
  .leaf{width:52px}
  .sec{padding:14px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <script>MW.renderChrome('interviews');</script>
    <div class="body">
      <div class="col-left scroll" id="left"></div>
      <div class="col-right">
        <section class="card rail-card" aria-labelledby="cal-title">
          <div class="cal-head">
            <h2 id="cal-title">November 2026</h2>
            <div class="cal-nav">
              <button type="button" id="calPrev" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
              <button type="button" id="calNext" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
            </div>
          </div>
          <div class="cal" id="cal" role="grid" aria-labelledby="cal-title"></div>
          <div class="legend"><span><i style="background:var(--green-700)"></i>Your interview</span><span><i style="background:#7FAE8E;width:6px;height:6px"></i>Open times to book</span></div>
        </section>
        <section class="card rail-card" aria-labelledby="rules-title">
          <h2 id="rules-title">How booking works</h2>
          <ul class="rules">
            <li><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#E8F0EA"/><path d="m7 12 3.5 3.5L17 9" fill="none" stroke="#1F4D34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>You can book once the employer moves your application to Interviewing.</li>
            <li><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#E8F0EA"/><path d="m7 12 3.5 3.5L17 9" fill="none" stroke="#1F4D34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Each application gets one 30-minute interview.</li>
            <li><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#E8F0EA"/><path d="m7 12 3.5 3.5L17 9" fill="none" stroke="#1F4D34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Times go fast. If someone books a time first, pick another.</li>
          </ul>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';
  const { $, $$, esc, ICON } = MW;
  MW.mountShell('interviews');
  const left = $('#left');
  const pick = {};          // appId -> { day, slotId }
  const justBooked = new Set();
  const notes = {};         // appId -> inline message

  const appsWith = () => MW.state.applications.map((a) => ({ ...a, job: MW.job(a.jobId), slot: a.slotId ? MW.slot(a.slotId) : null }));

  function bookingCard(a) {
    const j = a.job;
    if (justBooked.has(a.id) && a.slot) {
      return `<section class="card sec" id="book-${esc(a.id)}" aria-labelledby="bk-${esc(a.id)}">
        <div class="sec-head"><div><h2 id="bk-${esc(a.id)}">Interview booked</h2><p>${esc(j.company)} can see your booking now.</p></div></div>
        <div class="panel bk-done" role="status"><span class="ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <div><strong>${esc(j.title)}, ${esc(j.company)}</strong><span>${esc(MW.fmtDate(a.slot.start))}, ${esc(MW.fmtRange(a.slot.start, a.slot.end))}</span></div></div>
      </section>`;
    }
    const open = MW.openSlotsFor(a);
    const byDay = new Map();
    open.forEach((s) => { const k = MW.dayKey(s.start); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(s); });
    const p = pick[a.id] || (pick[a.id] = { day: byDay.keys().next().value, slotId: null });
    if (!byDay.has(p.day)) { p.day = byDay.keys().next().value; p.slotId = null; }
    const daySlots = byDay.get(p.day) || [];
    const chosen = p.slotId && MW.slot(p.slotId);
    return `<section class="card sec" id="book-${esc(a.id)}" aria-labelledby="bk-${esc(a.id)}" tabindex="-1">
      <div class="sec-head">
        <div><h2 id="bk-${esc(a.id)}">Book your interview</h2><p>${esc(j.company)} invited you to a 30-minute interview. Pick a time that works.</p></div>
        <span class="tz">${ICON.clock}Times in ${esc(MW.TZ_LABEL)}</span>
      </div>
      <div class="bk-job">${MW.logoHTML(j, 'sm')}<div><h3>${esc(j.title)}</h3><div class="meta"><span>${esc(j.company)}</span><span aria-hidden="true">·</span><span>${esc(j.location)}</span></div></div></div>
      ${open.length ? `
        <p class="bk-label" id="dl-${esc(a.id)}">Choose a day</p>
        <div class="days" role="group" aria-labelledby="dl-${esc(a.id)}">${[...byDay.entries()].map(([k, list]) => `
          <button type="button" class="day r-sm" data-day="${k}" aria-pressed="${k === p.day}" aria-label="${esc(MW.fmt(list[0].start, { weekday: 'long', month: 'long', day: 'numeric' }))}, ${list.length} open">
            <span class="dw">${esc(MW.fmt(list[0].start, { weekday: 'short' }))}</span><span class="dn">${esc(MW.fmt(list[0].start, { day: 'numeric' }))}</span><span class="dc">${list.length} open</span>
          </button>`).join('')}</div>
        <p class="bk-label" id="tl-${esc(a.id)}">Choose a time on ${esc(MW.fmt(daySlots[0].start, { weekday: 'long', month: 'short', day: 'numeric' }))}</p>
        <div class="slots" role="radiogroup" aria-labelledby="tl-${esc(a.id)}">${daySlots.map((s) => `
          <label class="slot" data-slot="${esc(s.id)}"><input type="radio" name="slot-${esc(a.id)}" value="${esc(s.id)}"${s.id === p.slotId ? ' checked' : ''}><span class="r-sm">${esc(MW.fmtTime(s.start))}</span></label>`).join('')}</div>
        ${notes[a.id] ? `<p class="bk-msg r-sm" role="alert">${esc(notes[a.id])}</p>` : ''}
        <div class="panel bk-bar">
          <p>${chosen ? `<b>${esc(MW.fmt(chosen.start, { weekday: 'short', month: 'short', day: 'numeric' }))}</b>, ${esc(MW.fmtRange(chosen.start, chosen.end))}` : 'No time selected yet'}</p>
          <button type="button" class="btn btn-primary" data-confirm="${esc(a.id)}"${chosen ? '' : ' disabled'}>Confirm booking</button>
        </div>` : `<div class="empty-inline">${esc(j.company)} has no open times right now. New times show up here as soon as they add them.</div>`}
    </section>`;
  }

  function ivRow(a, past) {
    const j = a.job, s = a.slot;
    const [month, day, year] = MW.dayKey(s.start).split('/').map(Number);
    const [todayMonth, todayDay, todayYear] = MW.dayKey(MW.NOW).split('/').map(Number);
    const days = (Date.UTC(year, month - 1, day) - Date.UTC(todayYear, todayMonth - 1, todayDay)) / 864e5;
    return `<div class="ivr${past ? ' past' : ''}">
      <div class="leaf r-md"><span class="m">${esc(MW.fmt(s.start, { month: 'short' }))}</span><span class="d">${esc(MW.fmt(s.start, { day: 'numeric' }))}</span></div>
      <div style="min-width:0">
        <h3>${esc(j.title)}</h3>
        <div class="meta"><span>${esc(j.company)}</span><span aria-hidden="true">·</span><span>${esc(j.location)}</span></div>
        <div class="when"><span>${ICON.cal}${esc(MW.fmt(s.start, { weekday: 'long' }))}</span><span>${ICON.clock}${esc(MW.fmtRange(s.start, s.end))}</span></div>
      </div>
      <div class="side">${past ? MW.statusHTML(a.status) : `<span class="soon">${days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : `In ${days} days`}</span>`}
        <a class="link-arrow" href="applications#${esc(a.id)}">Application ${ICON.arrow}</a></div>
    </div>`;
  }

  function render() {
    const all = appsWith();
    const toBook = all.filter((a) => a.status === 'Interviewing' && (!a.slotId || justBooked.has(a.id)));
    const booked = all.filter((a) => a.slot);
    const upcoming = booked.filter((a) => new Date(a.slot.start) >= MW.NOW).sort((x, y) => new Date(x.slot.start) - new Date(y.slot.start));
    const past = booked.filter((a) => new Date(a.slot.start) < MW.NOW).sort((x, y) => new Date(y.slot.start) - new Date(x.slot.start));
    left.innerHTML = toBook.map(bookingCard).join('') + `
      <section class="card sec" aria-labelledby="up-title">
        <div class="sec-head"><div><h2 id="up-title">Upcoming interviews</h2><p>${upcoming.length ? `${upcoming.length} scheduled. Employers see the same times.` : 'Nothing scheduled yet.'}</p></div><span class="tz">${ICON.clock}${esc(MW.TZ_LABEL)}</span></div>
        <div class="ivs">${upcoming.length ? upcoming.map((a) => ivRow(a, false)).join('') : `<div class="empty-inline">When an employer invites you to interview, you will book the time here.</div>`}</div>
      </section>
      ${past.length ? `<section class="card sec" aria-labelledby="past-title">
        <div class="sec-head"><div><h2 id="past-title">Past interviews</h2><p>Bookings stay attached to the application after a decision.</p></div></div>
        <div class="ivs">${past.map((a) => ivRow(a, true)).join('')}</div>
      </section>` : ''}`;
    renderCal();
  }

  left.addEventListener('click', (e) => {
    const day = e.target.closest('.day');
    if (day) {
      const id = day.closest('section').id.replace('book-', '');
      pick[id].day = day.dataset.day; pick[id].slotId = null; delete notes[id];
      render();
      const again = $(`#book-${id} .day[data-day="${day.dataset.day}"]`); if (again) again.focus();
      return;
    }
    const conf = e.target.closest('[data-confirm]');
    if (conf) confirmBooking(conf.dataset.confirm, conf);
  });
  left.addEventListener('change', (e) => {
    if (e.target.type !== 'radio') return;
    const id = e.target.name.replace('slot-', '');
    pick[id].slotId = e.target.value; delete notes[id];
    const sec = $(`#book-${id}`), s = MW.slot(e.target.value);
    $('.bk-bar p', sec).innerHTML = `<b>${esc(MW.fmt(s.start, { weekday: 'short', month: 'short', day: 'numeric' }))}</b>, ${esc(MW.fmtRange(s.start, s.end))}`;
    $('[data-confirm]', sec).disabled = false;
    const msg = $('.bk-msg', sec); if (msg) msg.remove();
  });

  function confirmBooking(appId, btn) {
    const slotId = pick[appId] && pick[appId].slotId;
    if (!slotId) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Booking…</span>';
    setTimeout(() => {
      const res = MW.book(appId, slotId);
      if (res.ok) {
        justBooked.add(appId);
        MW.toast(`Interview booked with ${res.app && MW.job(res.app.jobId).company}`);
        render();
        const sec = $(`#book-${appId}`); if (sec) sec.scrollIntoView({ block: 'nearest', behavior: MW.reduceMotion ? 'auto' : 'smooth' });
        return;
      }
      MW.toast(res.message, { error: true });
      if (res.message === 'Slot already booked') {
        notes[appId] = 'Someone booked that time a moment before you. It has been removed, so pick another time.';
        const lbl = $(`#book-${appId} .slot[data-slot="${slotId}"]`);
        pick[appId].slotId = null;
        if (lbl && !MW.reduceMotion) { lbl.classList.add('gone'); setTimeout(render, 480); } else render();
      } else { notes[appId] = res.message; render(); }
    }, MW.reduceMotion ? 0 : 650);
  }

  /* ---------- Month calendar ---------- */
  const nowParts = MW.dayKey(MW.NOW).split('/').map(Number); /* MM/DD/YYYY in PT */
  const months = [[nowParts[2], nowParts[0] - 1], nowParts[0] === 12 ? [nowParts[2] + 1, 0] : [nowParts[2], nowParts[0]]];
  let mi = 0;
  function renderCal() {
    const [y, m] = months[mi];
    $('#cal-title').textContent = new Date(Date.UTC(y, m, 15)).toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    $('#calPrev').disabled = mi === 0; $('#calNext').disabled = mi === months.length - 1;
    const ivDays = new Map(), openDays = new Set();
    MW.state.applications.forEach((a) => { if (a.slotId) { const s = MW.slot(a.slotId); ivDays.set(MW.dayKey(s.start), new Date(s.start) < MW.NOW); } });
    MW.state.applications.filter((a) => a.status === 'Interviewing' && !a.slotId).forEach((a) => MW.openSlotsFor(a).forEach((s) => openDays.add(MW.dayKey(s.start))));
    const first = new Date(Date.UTC(y, m, 1)), startDow = first.getUTCDay(), dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const today = MW.dayKey(MW.NOW);
    let html = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((d) => `<span class="wd" role="columnheader">${d}</span>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(Date.UTC(y, m, 1 - startDow + i));
      if (i >= 35 && d.getUTCMonth() !== m) break;
      const k = `${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}/${d.getUTCFullYear()}`;
      const cls = ['c', d.getUTCMonth() !== m ? 'out' : '', k === today ? 'today' : '', ivDays.has(k) ? (ivDays.get(k) ? 'ivpast' : 'iv') : '', openDays.has(k) && !ivDays.has(k) ? 'open' : ''].filter(Boolean).join(' ');
      const label = `${d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' })}${k === today ? ', today' : ''}${ivDays.has(k) ? ', interview' : ''}${openDays.has(k) ? ', open times' : ''}`;
      html += `<span class="${cls}" role="gridcell" aria-label="${esc(label)}"><b>${d.getUTCDate()}</b></span>`;
    }
    $('#cal').innerHTML = html;
    void dim;
  }
  $('#calPrev').addEventListener('click', () => { if (mi > 0) { mi--; renderCal(); } });
  $('#calNext').addEventListener('click', () => { if (mi < months.length - 1) { mi++; renderCal(); } });

  render();
  if (location.hash.startsWith('#book-')) {
    const sec = document.getElementById(location.hash.slice(1));
    if (sec) requestAnimationFrame(() => { sec.scrollIntoView({ block: 'start' }); sec.focus({ preventScroll: true }); });
  }
  MW.onChange(() => { render(); renderCal(); });
})();
</script>
<span id="mw-ready" hidden></span>
</body>
</html>
