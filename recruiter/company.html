<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchwork – Company Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../candidate/assets/shell.css">
<link rel="stylesheet" href="assets/recruiter.css">
<link rel="expect" href="#mw-ready" blocking="render">
<script src="../shared/html.js"></script>
<script src="../shared/match.js"></script>
<script src="assets/recruiter.js"></script>
<style>
.col-left.scroll,.col-right.scroll{padding-right:2px}
.col-left > .card,.col-right > .card{flex:none}
.sec{padding:20px 22px 22px 23px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px}
.sec-head h2{font-size:18px;line-height:24px;font-weight:700}
.sec-head p{margin-top:2px;font-size:14px;line-height:20px;color:#555A60;max-width:520px}

/* Identity */
#profile{container-type:inline-size}
.co{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 20px;align-items:center}
.co .logo-tile{width:76px;height:76px;font-size:32px;border-radius:calc(var(--r-lg) * var(--sq))}
.co h1{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.5px;overflow-wrap:anywhere}
.co .meta{margin-top:6px;gap:6px 14px}
.co .meta-item{display:inline-flex;align-items:flex-start;gap:5px;min-width:0;max-width:100%;overflow-wrap:anywhere}
.co .meta-item svg{margin-top:2px}
.co .meta-item a{min-width:0}
.co .meta a{color:var(--green-700);font-weight:600;text-decoration:none}
.co .meta a:hover{text-decoration:underline;text-underline-offset:3px}
.about{margin-top:18px;padding-top:18px;border-top:1px solid var(--row-line)}
.about h2{font-size:16px;line-height:20px;font-weight:700;margin-bottom:8px}
.about p{font-size:15px;line-height:23px;color:var(--ink-2);max-width:68ch;white-space:pre-line}
.view.enter,.edit.enter{animation:rowIn .32s var(--ease) both}
.edit .sec-head{margin-bottom:16px}

/* Open roles */
.roles{margin-top:12px;display:flex;flex-direction:column}
.role{display:grid;grid-template-columns:44px minmax(0,1fr) auto 18px;column-gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--row-line);text-decoration:none;color:inherit}
.role:first-child{border-top:0}
.role h3{font-size:15px;line-height:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role:hover h3{color:var(--green-900)}
.role .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.role svg.c{color:#9AA19C;transition:color .2s,transform .25s var(--ease)}
.role:hover svg.c{color:var(--green-700);transform:translateX(3px)}

/* Rail preview: the candidate's "About the company" block */
.preview-note{font-size:13px;line-height:18px;color:var(--muted)}
.pv{padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line-3);border-radius:calc(var(--r-md) * var(--sq));box-shadow:var(--shadow-sm)}
.pv-head{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:center}
.pv-head b{display:block;font-size:15px;line-height:20px;overflow-wrap:anywhere}
.pv h3{font-size:15px;line-height:20px;font-weight:700}
.pv p{font-size:13.5px;line-height:20px;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.pv .empty-val{color:#9AA19C;font-style:normal}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green-800);background:var(--green-100);border-radius:11px;padding:0 9px;line-height:22px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--green-500)}
.live[hidden]{display:none}

@media (max-width:1180px){ .col-right{flex-direction:row;flex-wrap:wrap} .col-right > *{flex:1 1 300px} }
@container (max-width:470px){
  .co{grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:start}
  .co .btn{grid-column:1 / -1;justify-self:start}
}
@media (max-width:640px){
  .co .logo-tile{width:60px;height:60px;font-size:26px}
  .co h1{font-size:24px;line-height:30px}
  .sec{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <svg class="deco-br" width="230" height="120" viewBox="0 0 230 120" aria-hidden="true"><path d="M230 0 C200 20 150 40 120 70 C95 95 60 110 0 120 L230 120Z" fill="#F2F3F3"/><path d="M230 30 C205 55 180 80 140 100 C120 110 100 116 80 120 L230 120Z" fill="#ECEEEE"/></svg>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <script>RW.renderChrome('company');</script>
    <div class="body">
      <div class="col-left scroll">
        <section class="card sec" id="profile" aria-label="Company profile"></section>
        <section class="card sec" aria-labelledby="roles-title">
          <div class="sec-head">
            <div><h2 id="roles-title">Open roles</h2><p>Candidates see these jobs under your company name.</p></div>
            <a class="link-arrow" href="jobs">Manage jobs <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          </div>
          <div class="roles" id="roles"></div>
        </section>
      </div>
      <div class="col-right scroll">
        <section class="card rail-card" aria-labelledby="pv-title">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 id="pv-title">What candidates see</h2><span class="live" id="live" hidden><i></i>Live preview</span></div>
          <p class="preview-note">This appears on every one of your job pages, under “About the company”.</p>
          <div class="pv" id="preview" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';
  const { $, $$, esc, ICON } = RW;
  const MAX = 800;
  const st = { mode: RW.params().get('edit') ? 'edit' : 'view', dirty: false };

  RW.mountShell('company');
  const card = $('#profile');

  const website = (w) => w ? `<a href="https://${esc(w.replace(/^https?:\/\//, ''))}" target="_blank" rel="noopener noreferrer">${esc(w.replace(/^https?:\/\//, ''))}<span class="sr"> (opens in a new tab)</span></a>` : '';
  function metaHTML(c) {
    return [
      c.industry && `<span class="meta-item">${esc(c.industry)}</span>`,
      c.size && `<span class="meta-item">${ICON.users}${esc(c.size)}</span>`,
      c.location && `<span class="meta-item">${ICON.pin}${esc(c.location)}</span>`,
      c.website && `<span class="meta-item">${ICON.globe}${website(c.website)}</span>`,
    ].filter(Boolean).join('');
  }

  function viewHTML(c) {
    return `<div class="view">
      <div class="co">
        ${RW.logoHTML()}
        <div><h1 id="co-name">${esc(c.name)}</h1><div class="meta">${metaHTML(c)}</div></div>
        <button type="button" class="btn btn-secondary" id="editBtn">${ICON.edit}Edit profile</button>
      </div>
      <div class="about"><h2>About</h2><p>${esc(c.about)}</p></div>
    </div>`;
  }

  function editHTML(c) {
    return `<form class="edit" id="form" novalidate>
      <div class="sec-head"><div><h2>Edit company profile</h2><p>Candidates see your name and description on every job you post.</p></div></div>
      <div class="form">
        <div class="field"><label for="fName">Company name <i aria-hidden="true">*</i></label>
          <input class="input" id="fName" maxlength="80" value="${esc(c.name)}" aria-describedby="eName" required><span class="err" id="eName"></span></div>
        <div class="field"><label for="fIndustry">Industry</label>
          <input class="input" id="fIndustry" maxlength="60" value="${esc(c.industry)}" placeholder="e.g. Software"></div>
        <div class="field"><label for="fSize">Company size</label>
          <select class="input" id="fSize"><option value="">Not shown</option>${RW.SIZES.map((s) => `<option${s === c.size ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
        <div class="field"><label for="fLoc">Headquarters</label>
          <input class="input" id="fLoc" maxlength="60" value="${esc(c.location)}" placeholder="City, state"></div>
        <div class="field full"><label for="fWeb">Website</label>
          <input class="input" id="fWeb" maxlength="100" value="${esc(c.website)}" placeholder="yourcompany.com" inputmode="url"></div>
        <div class="field full"><label for="fAbout">Description <i aria-hidden="true">*</i></label>
          <textarea class="input" id="fAbout" rows="6" aria-describedby="eAbout aboutMeta" required>${esc(c.about)}</textarea>
          <div class="ta-meta" id="aboutMeta"><span>What you build and what it is like to work with you.</span><span id="count"></span></div>
          <span class="err" id="eAbout"></span></div>
        <div class="form-actions">
          <button type="button" class="btn btn-quiet" id="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" title="Ctrl+Enter">Save changes</button>
        </div>
      </div>
    </form>`;
  }

  /* The draft as typed, so the preview can follow along before saving. */
  function draft() {
    if (st.mode !== 'edit') return RW.company();
    return { ...RW.company(), name: $('#fName').value.trim(), industry: $('#fIndustry').value.trim(), size: $('#fSize').value, location: $('#fLoc').value.trim(), website: $('#fWeb').value.trim(), about: $('#fAbout').value.trim() };
  }
  function renderPreview() {
    const c = draft();
    const mono = (c.name.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
    $('#preview').innerHTML = `<div class="pv-head"><span class="logo-tile sm mono" style="color:${esc(c.tint)};background:${esc(c.tileBg)}" aria-hidden="true">${esc(mono)}</span>
        <div style="min-width:0"><b>${c.name ? esc(c.name) : '<span class="empty-val">Company name</span>'}</b><div class="meta">${[c.industry, c.size].filter(Boolean).map(esc).join(' · ') || '<span class="empty-val">Industry · size</span>'}</div></div></div>
      <h3>About ${c.name ? esc(c.name) : 'the company'}</h3>
      <p>${c.about ? esc(c.about) : '<span class="empty-val">Your description shows here.</span>'}</p>`;
    $('#live').hidden = st.mode !== 'edit';
  }
  function renderCount() {
    const n = $('#fAbout').value.trim().length, el = $('#count');
    el.textContent = `${n} / ${MAX}`;
    el.classList.toggle('over', n > MAX);
  }

  function render(animate) {
    const c = RW.company();
    card.innerHTML = st.mode === 'edit' ? editHTML(c) : viewHTML(c);
    if (animate && !RW.reduceMotion) card.firstElementChild.classList.add('enter');
    if (st.mode === 'edit') wireForm(); else $('#editBtn').addEventListener('click', () => { st.mode = 'edit'; render(true); syncURL(); });
    renderPreview();
  }
  function syncURL() { const u = RW.url(); st.mode === 'edit' ? u.searchParams.set('edit', '1') : u.searchParams.delete('edit'); history.replaceState(null, '', u); }

  function wireForm() {
    const form = $('#form');
    renderCount();
    form.addEventListener('input', (e) => { st.dirty = true; renderPreview(); if (e.target.id === 'fAbout') renderCount(); const i = e.target; if (i.getAttribute('aria-invalid')) { i.removeAttribute('aria-invalid'); const er = $('#e' + i.id.slice(1)); if (er) er.textContent = ''; } });
    form.addEventListener('change', () => { st.dirty = true; renderPreview(); });
    $('#cancel').addEventListener('click', () => {
      if (st.dirty && !window.confirm('Discard your changes to the company profile?')) return;
      st.dirty = false; st.mode = 'view'; render(true); syncURL(); $('#editBtn').focus();
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const d = draft();
      if (d.about.length > MAX) { showErrors({ about: `Keep the description under ${MAX} characters.` }); return; }
      const res = RW.updateCompany({ name: d.name, industry: d.industry, size: d.size, location: d.location, website: d.website.replace(/^https?:\/\//, ''), about: d.about });
      if (!res.ok) { showErrors(res.errors || {}); if (!res.errors) RW.toast(res.message, { error: true }); return; }
      st.dirty = false; st.mode = 'view'; render(true); syncURL(); renderRoles();
      RW.toast('Company profile saved');
      $('#editBtn').focus();
    });
    $('#fName').focus({ preventScroll: true });
    /* Ctrl/Cmd+Enter saves, Escape cancels (popovers handle their own Escape first). */
    form.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
      else if (e.key === 'Escape' && !document.querySelector('.popover.open')) { e.preventDefault(); $('#cancel').click(); }
    });
  }
  function showErrors(errors) {
    const map = { name: ['#fName', '#eName'], about: ['#fAbout', '#eAbout'] };
    let first = null;
    Object.entries(errors).forEach(([k, msg]) => { const f = map[k]; if (!f) return; $(f[0]).setAttribute('aria-invalid', 'true'); $(f[1]).textContent = msg; first = first || $(f[0]); });
    if (first) { first.focus(); first.classList.remove('shake'); void first.offsetWidth; first.classList.add('shake'); }
  }
  window.addEventListener('beforeunload', (e) => { if (st.dirty) { e.preventDefault(); e.returnValue = ''; } });

  function renderRoles() {
    const open = RW.jobs().filter((j) => j.status === 'Active');
    $('#roles').innerHTML = open.length
      ? open.map((j) => `<a class="role" href="jobs?id=${encodeURIComponent(j.id)}">${RW.logoHTML('sm')}<span style="min-width:0"><h3>${esc(j.title)}</h3><span class="meta"><span class="type">${esc(j.type)}</span><span aria-hidden="true">·</span><span>${esc(j.location)}</span></span></span><span class="n">${j.apps} applicant${j.apps === 1 ? '' : 's'}</span><svg class="c" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>`).join('')
      : '<p class="ad-text">No open roles. <a href="jobs?new=1" style="color:var(--green-700);font-weight:600">Post a job</a></p>';
  }

  render(false);
  renderRoles();
})();
</script>
<span id="mw-ready" hidden></span>
</body>
</html>
